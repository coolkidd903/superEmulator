<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>superEmulator</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05070a;
    color:#fff;
    font-family:Arial,"Segoe UI",sans-serif;
}

button,input,select{font:inherit}

button{cursor:pointer}

.hidden{display:none!important}

/* =========================
   MENU
========================= */

#menu{
    position:fixed;
    inset:0;
    overflow:auto;
    background:
        radial-gradient(circle at 50% 0%,#1b2940 0%,#0b1018 45%,#040609 100%);
}

.menu-inner{
    width:min(900px,94vw);
    margin:auto;
    padding:50px 0 70px;
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo h1{
    margin:0;
    font-size:clamp(40px,7vw,72px);
    letter-spacing:4px;
    text-shadow:0 0 25px rgba(80,150,255,.35);
}

.logo p{
    margin:10px 0 0;
    color:#8498b3;
    font-size:14px;
}

.panel{
    padding:25px;
    border-radius:18px;
    background:rgba(14,21,32,.94);
    border:1px solid #29384d;
    box-shadow:0 25px 70px rgba(0,0,0,.45);
}

.field{
    margin-bottom:20px;
}

.field label{
    display:block;
    margin-bottom:8px;
    color:#bdcbe0;
    font-size:13px;
    font-weight:bold;
}

select,
input[type=file]{
    width:100%;
    min-height:45px;
    padding:8px 12px;
    border-radius:10px;
    border:1px solid #34445c;
    background:#080e17;
    color:#fff;
    outline:none;
}

select:focus,
input[type=file]:focus{
    border-color:#5b9cff;
}

.file-name{
    margin-top:6px;
    color:#71849d;
    font-size:12px;
    word-break:break-all;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

@media(max-width:650px){
    .grid{grid-template-columns:1fr}
}

.os-info{
    margin-top:10px;
    padding:12px;
    border-radius:10px;
    border:1px solid #243247;
    background:#080e17;
    color:#8ea3bf;
    font-size:12px;
    line-height:1.6;
}

.os-info strong{
    color:#e2ebf8;
}

.start-button{
    width:100%;
    min-height:56px;
    margin-top:5px;
    border:0;
    border-radius:14px;
    color:white;
    font-size:18px;
    font-weight:bold;
    background:linear-gradient(135deg,#3279ff,#5e9eff);
    box-shadow:0 10px 35px rgba(50,121,255,.25);
}

.start-button:hover{
    filter:brightness(1.1);
}

.start-button:disabled{
    opacity:.6;
    cursor:wait;
}

.warning{
    margin-top:18px;
    padding:12px;
    border-radius:10px;
    border:1px solid rgba(255,190,70,.2);
    background:rgba(255,190,70,.06);
    color:#cabb91;
    font-size:12px;
    line-height:1.6;
}

/* =========================
   EMULATOR
========================= */

#emulator{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    background:#000;
}

#screen_container{
    position:absolute;
    top:52px;
    left:0;
    right:0;
    bottom:0;
    overflow:auto;
    background:#000;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    z-index:1;
}

#screen_container>div{
    white-space:pre;
    font:14px monospace;
    line-height:14px;
}

#screen_container canvas{
    display:block;
    image-rendering:auto;
}

/* =========================
   TOOLBAR
========================= */

#toolbar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:52px;

    display:flex;
    align-items:center;
    gap:7px;

    padding:7px 10px;

    background:rgba(10,15,23,.98);
    border-bottom:1px solid #2b3b51;

    z-index:999999;
    box-shadow:0 3px 15px rgba(0,0,0,.5);
}

.tool-button{
    height:36px;
    min-width:42px;

    padding:0 12px;

    border-radius:8px;
    border:1px solid #35465e;

    background:#111a27;
    color:#eaf2ff;

    font-size:12px;
    font-weight:bold;
}

.tool-button:hover{
    background:#1c2a3c;
}

.power{
    background:#102619;
    border-color:#28613b;
}

.power.off{
    background:#281313;
    border-color:#673030;
}

.reset{
    background:#211a10;
    border-color:#654a27;
}

.tool-spacer{flex:1}

#status{
    color:#91a4bd;
    font-size:12px;
}

@media(max-width:700px){
    #status{display:none}
    .tool-button{
        padding:0 8px;
        font-size:11px;
    }
}

/* =========================
   LOADING
========================= */

#loading{
    position:absolute;
    top:52px;
    left:0;
    right:0;
    bottom:0;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#000;
    z-index:5000;
}

.loading-box{
    width:min(500px,90vw);
    text-align:center;
}

.spinner{
    width:44px;
    height:44px;

    margin:0 auto 20px;

    border:4px solid #263246;
    border-top-color:#5b9cff;
    border-radius:50%;

    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

#loadingText{
    font-weight:bold;
}

#loadingDetail{
    margin-top:8px;
    color:#71849e;
    font-size:12px;
}

/* =========================
   ERROR
========================= */

#errorOverlay{
    position:absolute;
    top:52px;
    left:0;
    right:0;
    bottom:0;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#050608;
    z-index:6000;
}

.error-box{
    width:min(800px,92vw);
    max-height:85vh;
    overflow:auto;

    padding:25px;

    background:#11171f;
    border:1px solid #492b2b;
    border-radius:16px;
}

.error-title{
    margin-bottom:12px;
    color:#ff9191;
    font-size:20px;
    font-weight:bold;
}

#errorMessage{
    padding:15px;
    max-height:350px;
    overflow:auto;

    white-space:pre-wrap;
    word-break:break-word;

    border-radius:10px;
    background:#080b0f;

    color:#d5dce6;
    font:12px/1.6 monospace;
}

.error-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:15px;
}

/* =========================
   LOG
========================= */

#logModal{
    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,.78);

    z-index:2000000;
}

.log-box{
    width:min(1000px,94vw);
    height:min(750px,90vh);

    display:flex;
    flex-direction:column;

    overflow:hidden;

    background:#10161f;
    border:1px solid #34465f;
    border-radius:15px;
}

.log-header{
    display:flex;
    align-items:center;
    gap:8px;

    padding:12px 14px;

    border-bottom:1px solid #2a384b;
}

.log-title{
    flex:1;
    font-weight:bold;
}

#logOutput{
    flex:1;

    margin:0;
    padding:15px;

    overflow:auto;

    background:#070a0e;
    color:#b8c8dc;

    font:12px/1.55 monospace;
    white-space:pre-wrap;
    word-break:break-word;
}

/* =========================
   TOAST
========================= */

#toast{
    position:fixed;
    left:50%;
    bottom:25px;

    transform:translate(-50%,20px);
    opacity:0;

    padding:10px 16px;

    background:#172131;
    border:1px solid #344a67;
    border-radius:10px;

    color:#fff;
    font-size:13px;

    pointer-events:none;

    z-index:3000000;
    transition:.2s;
}

#toast.show{
    opacity:1;
    transform:translate(-50%,0);
}
</style>
</head>

<body>

<!-- =====================================================
     MENU
===================================================== -->

<section id="menu">

<div class="menu-inner">

<div class="logo">
    <h1>superEmulator</h1>
    <p>Browser x86 PC Emulator</p>
</div>

<div class="panel">

<div class="field">

<label for="osSelect">
    起動するOS
</label>

<select id="osSelect">

<option value="win95">
Windows 95 / 32bit
</option>

<option value="win98">
Windows 98 / 32bit
</option>

<option value="winme">
Windows ME / 32bit
</option>

<option value="winnt">
Windows NT 4.0 / 32bit
</option>

<option value="win2000">
Windows 2000 / 32bit
</option>

<option value="winxp">
Windows XP / 32bit
</option>

<option value="winvista">
Windows Vista / 32bit
</option>

<option value="win7">
Windows 7 / 32bit
</option>

<option value="win8">
Windows 8 / 32bit
</option>

<option value="win10">
Windows 10 / 32bit
</option>

</select>

<div id="osInfo" class="os-info"></div>

</div>


<div class="field">

<label for="isoInput">
    OSインストールISO
</label>

<input
    id="isoInput"
    type="file"
    accept=".iso,application/octet-stream"
>

<div id="isoName" class="file-name">
    ISO未選択
</div>

</div>


<div class="grid">

<div class="field">

<label for="ramSelect">
    RAM
</label>

<select id="ramSelect">

<option value="32">32 MB</option>
<option value="64">64 MB</option>
<option value="128">128 MB</option>
<option value="256">256 MB</option>
<option value="512">512 MB</option>
<option value="1024">1024 MB</option>

</select>

</div>


<div class="field">

<label for="hddSize">
    仮想HDD
</label>

<select id="hddSize">

<option value="256">256 MB</option>
<option value="512">512 MB</option>
<option value="1024">1 GB</option>
<option value="2048">2 GB</option>
<option value="4096">4 GB</option>
<option value="8192">8 GB</option>
<option value="16384">16 GB</option>

</select>

</div>

</div>


<div class="field">

<label for="hddInput">
    既存HDDイメージ（任意）
</label>

<input
    id="hddInput"
    type="file"
    accept=".img,.bin,.vhd,application/octet-stream"
>

<div id="hddName" class="file-name">
    HDDイメージ未選択
</div>

</div>


<div class="field">

<label for="floppyInput">
    フロッピーイメージ（任意）
</label>

<input
    id="floppyInput"
    type="file"
    accept=".img,.ima,.flp,.bin,application/octet-stream"
>

<div id="floppyName" class="file-name">
    フロッピー未選択
</div>

</div>


<button
    id="startButton"
    class="start-button"
>
    ▶ エミュレーターを起動
</button>


<div class="warning">
    ⚠️ OSのISO・ディスクイメージは、自分が合法的に利用できるものを使用してください。
    superEmulatorにはWindows本体のファイルは含まれていません。
</div>

</div>

</div>

</section>


<!-- =====================================================
     EMULATOR
===================================================== -->

<section id="emulator" class="hidden">

<div id="toolbar">

<button
    id="powerButton"
    class="tool-button power"
>
    ⏻ 電源OFF
</button>

<button
    id="resetButton"
    class="tool-button reset"
>
    ↻ リセット
</button>

<button
    id="fullscreenButton"
    class="tool-button"
>
    ⛶ 全画面
</button>

<button
    id="logButton"
    class="tool-button"
>
    🛠 ログ
</button>

<button
    id="exitButton"
    class="tool-button"
>
    ← 戻る
</button>

<div class="tool-spacer"></div>

<div id="status">
    準備中
</div>

</div>


<div id="screen_container">

<div></div>

<canvas></canvas>

</div>


<div id="loading">

<div class="loading-box">

<div class="spinner"></div>

<div id="loadingText">
    エミュレーターを準備しています…
</div>

<div id="loadingDetail">
    BIOS / VGA BIOS / WASM / ディスクを読み込んでいます
</div>

</div>

</div>


<div id="errorOverlay" class="hidden">

<div class="error-box">

<div class="error-title">
    ⚠️ エミュレーターの起動に失敗しました
</div>

<pre id="errorMessage"></pre>

<div class="error-buttons">

<button
    id="errorLogButton"
    class="tool-button"
>
    🛠 詳細ログ
</button>

<button
    id="errorBackButton"
    class="tool-button"
>
    ← メニューへ
</button>

</div>

</div>

</div>

</section>


<!-- =====================================================
     LOG
===================================================== -->

<div id="logModal" class="hidden">

<div class="log-box">

<div class="log-header">

<div class="log-title">
    🛠 superEmulator 詳細ログ
</div>

<button
    id="copyLogButton"
    class="tool-button"
>
    コピー
</button>

<button
    id="clearLogButton"
    class="tool-button"
>
    クリア
</button>

<button
    id="closeLogButton"
    class="tool-button"
>
    閉じる
</button>

</div>

<pre id="logOutput"></pre>

</div>

</div>


<div id="toast"></div>


<!-- =====================================================
     v86
===================================================== -->

<script src="./libv86.js"></script>


<script>
"use strict";

/* =====================================================
   GLOBAL
===================================================== */

let emulator = null;

let selectedISO = null;
let selectedHDD = null;
let selectedFloppy = null;

let currentOS = "win95";

let isRunning = false;
let isStarting = false;

let bootingPromise = null;

let logLines = [];

let toastTimer = null;


/* =====================================================
   DOM
===================================================== */

const $ = id => document.getElementById(id);

const menu = $("menu");
const emulatorUI = $("emulator");

const osSelect = $("osSelect");

const isoInput = $("isoInput");
const hddInput = $("hddInput");
const floppyInput = $("floppyInput");

const isoName = $("isoName");
const hddName = $("hddName");
const floppyName = $("floppyName");

const ramSelect = $("ramSelect");
const hddSize = $("hddSize");

const osInfo = $("osInfo");

const startButton = $("startButton");

const powerButton = $("powerButton");
const resetButton = $("resetButton");
const fullscreenButton = $("fullscreenButton");
const logButton = $("logButton");
const exitButton = $("exitButton");

const status = $("status");

const loading = $("loading");
const loadingText = $("loadingText");
const loadingDetail = $("loadingDetail");

const errorOverlay = $("errorOverlay");
const errorMessage = $("errorMessage");

const errorLogButton = $("errorLogButton");
const errorBackButton = $("errorBackButton");

const logModal = $("logModal");
const logOutput = $("logOutput");

const copyLogButton = $("copyLogButton");
const clearLogButton = $("clearLogButton");
const closeLogButton = $("closeLogButton");

const toast = $("toast");


/* =====================================================
   OS CONFIG
===================================================== */

const OS_CONFIG = {

    win95:{
        name:"Windows 95",
        ram:64,
        hdd:1024,
        acpi:false,
        cpuid:null,
        info:
            "Windows 95向け。64MB RAM / 1GB HDD / ACPI OFF。"
    },

    win98:{
        name:"Windows 98",
        ram:128,
        hdd:1024,
        acpi:false,
        cpuid:null,
        info:
            "Windows 98向け。128MB RAM / 1GB HDD / ACPI OFF。"
    },

    winme:{
        name:"Windows ME",
        ram:128,
        hdd:1024,
        acpi:false,
        cpuid:null,
        info:
            "Windows ME向け。128MB RAM / 1GB HDD / ACPI OFF。"
    },

    winnt:{
        name:"Windows NT 4.0",
        ram:64,
        hdd:1024,
        acpi:false,
        cpuid:2,
        info:
            "Windows NT 4.0向け。CPUID level 2 / ACPI OFF。"
    },

    win2000:{
        name:"Windows 2000",
        ram:256,
        hdd:2048,
        acpi:false,
        cpuid:null,
        info:
            "Windows 2000向け。256MB RAM / ACPI OFF。"
    },

    winxp:{
        name:"Windows XP 32bit",
        ram:512,
        hdd:4096,
        acpi:false,
        cpuid:null,
        info:
            "Windows XP 32bit向け。512MB RAM / 4GB HDD / ACPI OFF。"
    },

    winvista:{
        name:"Windows Vista 32bit",
        ram:512,
        hdd:8192,
        acpi:true,
        cpuid:null,
        info:
            "Windows Vista 32bit向け。512MB以上 / ACPI ON。"
    },

    win7:{
        name:"Windows 7 32bit",
        ram:512,
        hdd:8192,
        acpi:true,
        cpuid:null,
        info:
            "Windows 7 32bit向け。512MB以上 / ACPI ON。"
    },

    win8:{
        name:"Windows 8 32bit",
        ram:1024,
        hdd:8192,
        acpi:true,
        cpuid:null,
        info:
            "Windows 8 32bit向け。1GB RAM / ACPI ON。"
    },

    win10:{
        name:"Windows 10 32bit",
        ram:1024,
        hdd:16384,
        acpi:true,
        cpuid:null,
        info:
            "Windows 10 32bit。1GB RAM / ACPI ON。v86では正式な完全対応は保証されません。"
    }

};


/* =====================================================
   LOG
===================================================== */

function nowTime(){

    return new Date().toLocaleTimeString(
        "ja-JP",
        {
            hour12:false
        }
    );

}


function log(message,type="INFO"){

    const line =
        "[" +
        nowTime() +
        "] [" +
        type +
        "] " +
        String(message);

    logLines.push(line);

    if(logLines.length > 5000){
        logLines.shift();
    }

    if(logOutput){
        logOutput.textContent =
            logLines.join("\n");

        logOutput.scrollTop =
            logOutput.scrollHeight;
    }

    console.log(line);

}


function logError(message){

    log(message,"ERROR");

}


window.addEventListener(
    "error",
    event => {

        logError(
            "window.error: " +
            event.message +
            " @ " +
            event.filename +
            ":" +
            event.lineno +
            ":" +
            event.colno
        );

    }
);


window.addEventListener(
    "unhandledrejection",
    event => {

        logError(
            "Unhandled rejection: " +
            (
                event.reason?.stack ||
                event.reason ||
                "unknown"
            )
        );

    }
);


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

    toast.textContent =
        message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(
            () => {
                toast.classList.remove("show");
            },
            2200
        );

}


/* =====================================================
   FORMAT
===================================================== */

function formatBytes(bytes){

    if(bytes < 1024){
        return bytes + " B";
    }

    if(bytes < 1024 * 1024){
        return (
            bytes / 1024
        ).toFixed(1) + " KB";
    }

    if(bytes < 1024 * 1024 * 1024){
        return (
            bytes /
            1024 /
            1024
        ).toFixed(1) + " MB";
    }

    return (
        bytes /
        1024 /
        1024 /
        1024
    ).toFixed(2) + " GB";

}


/* =====================================================
   FILES
===================================================== */

isoInput.addEventListener(
    "change",
    () => {

        selectedISO =
            isoInput.files?.[0] ||
            null;

        if(selectedISO){

            isoName.textContent =
                selectedISO.name +
                " (" +
                formatBytes(
                    selectedISO.size
                ) +
                ")";

            log(
                "ISO selected: " +
                selectedISO.name +
                " / " +
                selectedISO.size +
                " bytes"
            );

        }

    }
);


hddInput.addEventListener(
    "change",
    () => {

        selectedHDD =
            hddInput.files?.[0] ||
            null;

        if(selectedHDD){

            hddName.textContent =
                selectedHDD.name +
                " (" +
                formatBytes(
                    selectedHDD.size
                ) +
                ")";

            log(
                "HDD selected: " +
                selectedHDD.name
            );

        }

    }
);


floppyInput.addEventListener(
    "change",
    () => {

        selectedFloppy =
            floppyInput.files?.[0] ||
            null;

        if(selectedFloppy){

            floppyName.textContent =
                selectedFloppy.name +
                " (" +
                formatBytes(
                    selectedFloppy.size
                ) +
                ")";

            log(
                "Floppy selected: " +
                selectedFloppy.name
            );

        }

    }
);


/* =====================================================
   OS
===================================================== */

osSelect.addEventListener(
    "change",
    () => {

        currentOS =
            osSelect.value;

        updateOSInfo();

    }
);


function updateOSInfo(){

    const cfg =
        OS_CONFIG[currentOS];

    if(!cfg){
        return;
    }

    osInfo.innerHTML =
        "<strong>" +
        escapeHTML(cfg.name) +
        "</strong><br>" +
        escapeHTML(cfg.info);

    ramSelect.value =
        String(cfg.ram);

    hddSize.value =
        String(cfg.hdd);

    log(
        "OS selected: " +
        cfg.name
    );

}


function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


updateOSInfo();


/* =====================================================
   UI
===================================================== */

function showEmulator(){

    menu.classList.add("hidden");
    emulatorUI.classList.remove("hidden");

}


function showMenu(){

    emulatorUI.classList.add("hidden");
    menu.classList.remove("hidden");

}


function setLoading(
    visible,
    text="",
    detail=""
){

    if(visible){

        loading.classList.remove("hidden");

        loadingText.textContent =
            text;

        loadingDetail.textContent =
            detail;

    }else{

        loading.classList.add("hidden");

    }

}


function showError(error){

    const text =
        error?.stack ||
        String(error);

    errorMessage.textContent =
        text;

    errorOverlay.classList.remove(
        "hidden"
    );

    setLoading(false);

    logError(text);

}


function hideError(){

    errorOverlay.classList.add(
        "hidden"
    );

}


/* =====================================================
   RESOURCE CHECK
===================================================== */

async function checkResource(path){

    /*
     * GitHub Pages / HTTPSでは確認する。
     */

    if(location.protocol === "file:"){

        log(
            "file:// detected. Fetch test skipped.",
            "WARN"
        );

        return true;

    }

    const response =
        await fetch(
            path,
            {
                method:"HEAD",
                cache:"no-store"
            }
        );

    if(!response.ok){

        throw new Error(
            path +
            " が読み込めません。HTTP " +
            response.status
        );

    }

    log(
        "Resource OK: " +
        path
    );

    return true;

}


/* =====================================================
   FILE -> BUFFER
===================================================== */

async function readFile(file){

    if(!file){
        return null;
    }

    log(
        "Reading: " +
        file.name +
        " (" +
        formatBytes(file.size) +
        ")"
    );

    const buffer =
        await file.arrayBuffer();

    log(
        "Loaded: " +
        file.name
    );

    return buffer;

}


/* =====================================================
   SCREEN
===================================================== */

function resetScreen(){

    const screen =
        $("screen_container");

    screen.innerHTML =
        "<div></div><canvas></canvas>";

}


/* =====================================================
   BUILD CONFIG
===================================================== */

function buildConfig(
    isoBuffer,
    hddBuffer,
    floppyBuffer
){

    const cfg =
        OS_CONFIG[currentOS];

    const ramMB =
        Number(ramSelect.value);

    const hddMB =
        Number(hddSize.value);


    const config = {

        wasm_path:
            "./v86.wasm",

        memory_size:
            ramMB *
            1024 *
            1024,

        vga_memory_size:
            8 *
            1024 *
            1024,

        screen_container:
            $("screen_container"),

        bios:{
            url:
                "./seabios.bin"
        },

        vga_bios:{
            url:
                "./vgabios.bin"
        },

        cdrom:{
            buffer:
                isoBuffer
        },

        hda:
            hddBuffer
            ? {
                buffer:
                    hddBuffer
            }
            : {
                size:
                    hddMB *
                    1024 *
                    1024
            },

        acpi:
            cfg.acpi,

        boot_order:
            0x213,

        fastboot:false,

        autostart:true

    };


    if(
        cfg.cpuid !== null &&
        cfg.cpuid !== undefined
    ){

        config.cpuid_level =
            cfg.cpuid;

    }


    if(floppyBuffer){

        config.fda = {
            buffer:
                floppyBuffer
        };

    }


    return config;

}


/* =====================================================
   CREATE INSTANCE
===================================================== */

async function createInstance(){

    if(
        typeof window.V86 !==
        "function"
    ){

        throw new Error(
            "V86 constructorが見つかりません。\n" +
            "libv86.jsとv86.wasmが同じv86ビルドか確認してください。"
        );

    }


    if(!selectedISO){

        throw new Error(
            "ISOファイルが選択されていません。"
        );

    }


    setLoading(
        true,
        "ISOを読み込んでいます…",
        selectedISO.name
    );


    const isoBuffer =
        await readFile(
            selectedISO
        );


    let hddBuffer = null;

    if(selectedHDD){

        setLoading(
            true,
            "HDDイメージを読み込んでいます…",
            selectedHDD.name
        );

        hddBuffer =
            await readFile(
                selectedHDD
            );

    }


    let floppyBuffer = null;

    if(selectedFloppy){

        setLoading(
            true,
            "フロッピーを読み込んでいます…",
            selectedFloppy.name
        );

        floppyBuffer =
            await readFile(
                selectedFloppy
            );

    }


    resetScreen();


    const config =
        buildConfig(
            isoBuffer,
            hddBuffer,
            floppyBuffer
        );


    log(
        "======================================"
    );

    log(
        "Creating new v86 instance"
    );

    log(
        "OS: " +
        OS_CONFIG[currentOS].name
    );

    log(
        "RAM: " +
        (
            Number(ramSelect.value)
        ) +
        " MB"
    );

    log(
        "HDD: " +
        (
            Number(hddSize.value)
        ) +
        " MB"
    );

    log(
        "ACPI: " +
        config.acpi
    );

    if(config.cpuid_level !== undefined){

        log(
            "CPUID level: " +
            config.cpuid_level
        );

    }


    emulator =
        new V86(config);


    log(
        "New v86 instance created."
    );


    isRunning = true;

    updatePowerButton();

    status.textContent =
        "起動中";


    /*
     * イベント
     */

    if(
        typeof emulator.add_listener ===
        "function"
    ){

        emulator.add_listener(
            "emulator-ready",
            () => {

                log(
                    "Event: emulator-ready"
                );

            }
        );


        emulator.add_listener(
            "emulator-started",
            () => {

                isRunning = true;

                status.textContent =
                    "起動中";

                updatePowerButton();

                log(
                    "Event: emulator-started"
                );

            }
        );


        emulator.add_listener(
            "emulator-stopped",
            () => {

                log(
                    "Event: emulator-stopped"
                );

            }
        );

    }


    /*
     * autostart:trueなので
     * ここではrun()を呼ばない。
     */

    log(
        "autostart=true."
    );

    log(
        "Manual startup run() skipped."
    );


    setTimeout(
        () => {

            setLoading(false);

        },
        1200
    );

}


/* =====================================================
   START
===================================================== */

async function startEmulator(){

    if(isStarting){
        return;
    }

    isStarting = true;

    startButton.disabled = true;

    startButton.textContent =
        "⏳ 起動中…";


    try{

        hideError();

        showEmulator();


        log(
            "======================================"
        );

        log(
            "superEmulator startup"
        );

        log(
            "Protocol: " +
            location.protocol
        );

        log(
            "URL: " +
            location.href
        );


        if(location.protocol === "file:"){

            log(
                "WARNING: file:// is not recommended.",
                "WARN"
            );

        }


        await checkResource(
            "./v86.wasm"
        );

        await checkResource(
            "./seabios.bin"
        );

        await checkResource(
            "./vgabios.bin"
        );


        await createInstance();


    }catch(error){

        isRunning = false;

        updatePowerButton();

        showError(error);

    }finally{

        isStarting = false;

        startButton.disabled = false;

        startButton.textContent =
            "▶ エミュレーターを起動";

    }

}


/* =====================================================
   START BUTTON
===================================================== */

startButton.addEventListener(
    "click",
    startEmulator
);


/* =====================================================
   POWER
===================================================== */

powerButton.addEventListener(
    "click",
    async () => {

        if(isStarting){

            showToast(
                "起動処理中です"
            );

            return;

        }


        if(!emulator){

            showToast(
                "エミュレーターがありません"
            );

            return;

        }


        if(isRunning){

            /*
             * 重要:
             *
             * stop()だけして同じinstanceを
             * run()するのをやめる。
             *
             * これが今回の
             *
             * memory_map_read8[...] is not a function
             *
             * 対策。
             */

            try{

                log(
                    "Power OFF requested."
                );


                await emulator.stop();


                log(
                    "Emulator stopped."
                );


                isRunning = false;

                status.textContent =
                    "電源OFF";

                updatePowerButton();


                showToast(
                    "電源OFF"
                );


            }catch(error){

                showError(error);

            }


            return;

        }


        /*
         * 電源OFF状態からON:
         *
         * 古いv86を破棄して
         * 新しいv86を生成する。
         */

        try{

            log(
                "Power ON requested."
            );

            log(
                "Old emulator instance will be destroyed."
            );


            if(
                emulator &&
                typeof emulator.destroy ===
                "function"
            ){

                await emulator.destroy();

            }


            emulator = null;

            isRunning = false;


            updatePowerButton();


            /*
             * 新しいインスタンスを作る。
             */

            await createInstance();


            showToast(
                "新しい仮想PCを起動しました"
            );


        }catch(error){

            isRunning = false;

            updatePowerButton();

            showError(error);

        }

    }
);


/* =====================================================
   POWER UI
===================================================== */

function updatePowerButton(){

    if(isRunning){

        powerButton.textContent =
            "⏻ 電源OFF";

        powerButton.classList.remove(
            "off"
        );

    }else{

        powerButton.textContent =
            "⏻ 電源ON";

        powerButton.classList.add(
            "off"
        );

    }

}


/* =====================================================
   RESET
===================================================== */

resetButton.addEventListener(
    "click",
    () => {

        if(!emulator){

            showToast(
                "エミュレーターがありません"
            );

            return;

        }


        try{

            log(
                "Reset requested."
            );


            /*
             * restart()はv86の公開API。
             */

            if(
                typeof emulator.restart !==
                "function"
            ){

                throw new Error(
                    "restart()が使用できないv86ビルドです。"
                );

            }


            emulator.restart();


            isRunning = true;

            status.textContent =
                "リセット中";

            updatePowerButton();


            setTimeout(
                () => {

                    status.textContent =
                        "起動中";

                },
                1000
            );


            log(
                "emulator.restart() called."
            );


        }catch(error){

            logError(
                "Reset failed: " +
                (
                    error.stack ||
                    error.message
                )
            );

            showToast(
                "リセットに失敗しました。ログを確認してください。"
            );

        }

    }
);


/* =====================================================
   FULLSCREEN
===================================================== */

fullscreenButton.addEventListener(
    "click",
    async () => {

        try{

            if(
                !document.fullscreenElement
            ){

                await emulatorUI.requestFullscreen();

                log(
                    "Fullscreen enabled."
                );

            }else{

                await document.exitFullscreen();

                log(
                    "Fullscreen disabled."
                );

            }

        }catch(error){

            logError(
                "Fullscreen failed: " +
                error.message
            );

            showToast(
                "全画面化に失敗しました"
            );

        }

    }
);


document.addEventListener(
    "fullscreenchange",
    () => {

        fullscreenButton.textContent =
            document.fullscreenElement
            ? "⛶ 全画面解除"
            : "⛶ 全画面";

    }
);


/* =====================================================
   LOG MODAL
===================================================== */

function openLog(){

    logOutput.textContent =
        logLines.join("\n");

    logOutput.scrollTop =
        logOutput.scrollHeight;

    logModal.classList.remove(
        "hidden"
    );

}


function closeLog(){

    logModal.classList.add(
        "hidden"
    );

}


logButton.addEventListener(
    "click",
    openLog
);


errorLogButton.addEventListener(
    "click",
    openLog
);


closeLogButton.addEventListener(
    "click",
    closeLog
);


logModal.addEventListener(
    "click",
    event => {

        if(event.target === logModal){

            closeLog();

        }

    }
);


/* =====================================================
   COPY LOG
===================================================== */

copyLogButton.addEventListener(
    "click",
    async () => {

        try{

            await navigator.clipboard.writeText(
                logLines.join("\n")
            );

            showToast(
                "ログをコピーしました"
            );

        }catch(error){

            logError(
                "Copy failed: " +
                error.message
            );

        }

    }
);


/* =====================================================
   CLEAR LOG
===================================================== */

clearLogButton.addEventListener(
    "click",
    () => {

        logLines = [];

        logOutput.textContent = "";

        log(
            "Log cleared."
        );

    }
);


/* =====================================================
   DESTROY
===================================================== */

async function destroyEmulator(){

    if(!emulator){
        return;
    }


    try{

        log(
            "Destroying emulator..."
        );


        if(
            typeof emulator.destroy ===
            "function"
        ){

            await emulator.destroy();

        }else if(
            typeof emulator.stop ===
            "function"
        ){

            await emulator.stop();

        }


        log(
            "Emulator destroyed."
        );


    }catch(error){

        logError(
            "Destroy failed: " +
            (
                error.stack ||
                error.message
            )
        );

    }


    emulator = null;

    isRunning = false;

    updatePowerButton();

}


/* =====================================================
   EXIT
===================================================== */

exitButton.addEventListener(
    "click",
    async () => {

        await destroyEmulator();

        hideError();

        setLoading(false);

        showMenu();

        status.textContent =
            "準備中";

    }
);


/* =====================================================
   ERROR BACK
===================================================== */

errorBackButton.addEventListener(
    "click",
    async () => {

        await destroyEmulator();

        hideError();

        showMenu();

    }
);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    event => {

        /*
         * Ctrl + Alt + L
         */

        if(
            event.ctrlKey &&
            event.altKey &&
            event.key.toLowerCase() === "l"
        ){

            event.preventDefault();

            openLog();

        }


        /*
         * Escapeでログを閉じる
         */

        if(
            event.key === "Escape" &&
            !logModal.classList.contains("hidden")
        ){

            closeLog();

        }

    }
);


/* =====================================================
   INITIAL LOG
===================================================== */

log(
    "superEmulator initialized."
);

log(
    "Target OS: Windows 95 - Windows 10 32-bit."
);

log(
    "v86 startup: autostart=true."
);

log(
    "Power cycle strategy: destroy + recreate."
);

log(
    "Reset strategy: emulator.restart()."
);

log(
    "Ready."
);

log(
    "User agent: " +
    navigator.userAgent
);

log(
    "Hardware concurrency: " +
    (
        navigator.hardwareConcurrency ||
        "unknown"
    )
);

log(
    "Device memory: " +
    (
        navigator.deviceMemory
        ? navigator.deviceMemory + " GB"
        : "unknown"
    )
);

updatePowerButton();

</script>
