<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>superEmulator</title>

<script src="./libv86.js"></script>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:system-ui,sans-serif;
}

button,input,select{
    font:inherit;
}

button{
    cursor:pointer;
}

#menu{
    width:100%;
    height:100%;
    overflow:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
    background:
        radial-gradient(
            circle at 50% 15%,
            #252525,
            #0b0b0b 50%,
            #000
        );
}

.panel{
    width:min(850px,96vw);
    max-height:95vh;
    overflow:auto;
    padding:30px;
    border:1px solid #444;
    border-radius:20px;
    background:#111;
    box-shadow:0 25px 100px #000;
}

.logo{
    text-align:center;
    font-size:42px;
    font-weight:900;
}

.subtitle{
    text-align:center;
    color:#888;
    margin:5px 0 25px;
}

.section{
    margin-top:18px;
    padding:18px;
    border:1px solid #292929;
    border-radius:12px;
    background:#0a0a0a;
}

.sectionTitle{
    font-weight:800;
    color:#ccc;
    margin-bottom:12px;
}

.field{
    margin-top:12px;
}

label{
    display:block;
    color:#aaa;
    font-size:13px;
    margin-bottom:6px;
}

input[type=file],
select{
    width:100%;
    padding:11px;
    background:#111;
    color:#fff;
    border:1px solid #444;
    border-radius:8px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

@media(max-width:650px){
    .grid{
        grid-template-columns:1fr;
    }

    .panel{
        padding:20px;
    }
}

.mainButton{
    width:100%;
    margin-top:20px;
    padding:16px;
    border:0;
    border-radius:10px;
    background:#fff;
    color:#111;
    font-weight:800;
    font-size:17px;
}

.mainButton:hover{
    background:#ddd;
}

.mainButton:disabled{
    opacity:.4;
}

.status{
    margin-top:13px;
    padding:12px;
    background:#080808;
    border:1px solid #333;
    border-radius:9px;
    color:#aaa;
    font:12px monospace;
    white-space:pre-wrap;
    word-break:break-word;
}

.status.ok{
    color:#91ff91;
}

.status.warn{
    color:#ffd866;
}

.status.error{
    color:#ff7777;
}

#diagnostics{
    padding:12px;
    background:#080808;
    border:1px solid #292929;
    border-radius:9px;
    font:12px monospace;
    line-height:1.7;
}

.ok{
    color:#91ff91;
}

.bad{
    color:#ff7777;
}

.warn{
    color:#ffd866;
}

.note{
    color:#777;
    font-size:12px;
    line-height:1.6;
    margin-top:7px;
}


/* ==============================
   EMULATOR
============================== */

#emulator{
    position:fixed;
    inset:0;
    display:none;
    background:#000;
    z-index:1000;
}

#screen{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
}

#screen canvas{
    max-width:100%;
    max-height:100%;
}

#screen > div{
    color:#fff;
    font:14px monospace;
    white-space:pre;
}


/* ==============================
   TOOLBAR
============================== */

#toolbar{
    position:absolute;
    top:10px;
    left:10px;
    right:10px;
    z-index:3000;

    display:flex;
    gap:7px;

    opacity:0;
    transition:.2s;
}

#emulator:hover #toolbar{
    opacity:1;
}

.tool{
    width:auto;
    margin:0;
    padding:9px 13px;

    border:1px solid #555;
    border-radius:8px;

    background:rgba(15,15,15,.9);
    color:#fff;
}

.tool:hover{
    background:#292929;
}

.powerOn{
    border-color:#477b47;
}

.powerOff{
    border-color:#8a4444;
}


/* ==============================
   BOOT OVERLAY
============================== */

#bootOverlay{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.9);

    z-index:4000;

    text-align:center;
}

.spinner{
    width:45px;
    height:45px;
    margin:0 auto 15px;

    border:4px solid #333;
    border-top-color:#fff;
    border-radius:50%;

    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

#bootText{
    color:#ccc;
}


/* ==============================
   POWER STATUS
============================== */

#powerIndicator{
    position:absolute;
    bottom:12px;
    right:12px;

    z-index:2500;

    padding:7px 10px;

    background:rgba(0,0,0,.7);
    border-radius:7px;

    font:11px monospace;
    color:#888;
}
</style>
</head>

<body>

<!-- =========================================================
     MENU
========================================================= -->

<section id="menu">

<div class="panel">

    <div class="logo">
        superEmulator
    </div>

    <div class="subtitle">
        Browser PC Emulator
    </div>


    <div class="section">

        <div class="sectionTitle">
            🖥 仮想PC
        </div>

        <div class="grid">

            <div class="field">

                <label>
                    アーキテクチャ
                </label>

                <select id="architecture">

                    <option value="x86">
                        x86 / 32-bit
                    </option>

                    <option value="x64">
                        x86-64 / 64-bit
                    </option>

                </select>

            </div>


            <div class="field">

                <label>
                    OS
                </label>

                <select id="osProfile">

                    <option value="generic">
                        Generic x86
                    </option>

                    <option value="win95">
                        Windows 95 / 98 / ME
                    </option>

                    <option value="winxp">
                        Windows XP
                    </option>

                    <option value="win10">
                        Windows 10
                    </option>

                    <option value="win11">
                        Windows 11
                    </option>

                </select>

            </div>

        </div>

    </div>


    <div class="section">

        <div class="sectionTitle">
            💿 ISO
        </div>

        <input
            id="iso"
            type="file"
            accept=".iso,application/octet-stream"
        >

        <div class="note">
            自分で用意したOSのISOを選択してください。
        </div>

    </div>


    <div class="section">

        <div class="sectionTitle">
            ⚙️ メモリ・ディスク
        </div>

        <div class="grid">

            <div class="field">

                <label>
                    RAM
                </label>

                <select id="ram">

                    <option value="67108864">
                        64 MB
                    </option>

                    <option value="134217728">
                        128 MB
                    </option>

                    <option value="268435456">
                        256 MB
                    </option>

                    <option value="536870912" selected>
                        512 MB
                    </option>

                    <option value="1073741824">
                        1 GB
                    </option>

                </select>

            </div>


            <div class="field">

                <label>
                    仮想HDD
                </label>

                <select id="diskSize">

                    <option value="268435456">
                        256 MB
                    </option>

                    <option value="536870912">
                        512 MB
                    </option>

                    <option value="1073741824">
                        1 GB
                    </option>

                    <option value="2147483648" selected>
                        2 GB
                    </option>

                </select>

            </div>

        </div>


        <div class="field">

            <label>
                既存HDDイメージ（任意）
            </label>

            <input
                id="hdd"
                type="file"
                accept=".img,.ima,.bin,.vhd,application/octet-stream"
            >

        </div>

    </div>


    <div class="section">

        <div class="sectionTitle">
            💾 ブートフロッピー（任意）
        </div>

        <input
            id="fda"
            type="file"
            accept=".img,.ima,.flp,.bin,application/octet-stream"
        >

        <div class="note">
            Windows 95などのブート非対応CDを使う場合に指定できます。
        </div>

    </div>


    <div class="section">

        <div class="sectionTitle">
            🔍 起動前診断
        </div>

        <div id="diagnostics">
            診断中...
        </div>

    </div>


    <button
        id="boot"
        class="mainButton"
    >
        🚀 起動
    </button>


    <div
        id="status"
        class="status"
    >
        待機中
    </div>

</div>

</section>


<!-- =========================================================
     EMULATOR
========================================================= -->

<section id="emulator">

    <div id="toolbar">

        <!-- ★ 電源ボタン -->
        <button
            id="power"
            class="tool powerOff"
        >
            🔴 電源
        </button>

        <button
            id="runPause"
            class="tool"
        >
            ⏸ 一時停止
        </button>

        <button
            id="reset"
            class="tool"
        >
            🔄 リセット
        </button>

        <button
            id="fullscreen"
            class="tool"
        >
            ⛶ 全画面
        </button>

        <button
            id="exit"
            class="tool"
        >
            ✕ 終了
        </button>

    </div>


    <div id="screen">

        <div></div>

        <canvas
            style="display:none"
        ></canvas>

    </div>


    <div id="powerIndicator">
        POWER: OFF
    </div>


    <div id="bootOverlay">

        <div>

            <div class="spinner"></div>

            <div id="bootText">
                起動しています...
            </div>

        </div>

    </div>

</section>


<script>
"use strict";


/* =========================================================
   GLOBAL STATE
========================================================= */

let emulator = null;

let poweredOn = false;

let paused = false;


/* =========================================================
   HELPERS
========================================================= */

const $ = id =>
    document.getElementById(id);


function setStatus(
    text,
    type=""
){

    const el =
        $("status");

    el.textContent =
        text;

    el.className =
        "status " + type;
}


function setBootText(
    text
){

    $("bootText").textContent =
        text;
}


function setPowerState(
    state
){

    poweredOn =
        state;

    const indicator =
        $("powerIndicator");

    const button =
        $("power");


    if(state){

        indicator.textContent =
            "POWER: ON";

        indicator.style.color =
            "#91ff91";

        button.textContent =
            "🟢 電源ON";

        button.classList.remove(
            "powerOff"
        );

        button.classList.add(
            "powerOn"
        );

    }else{

        indicator.textContent =
            "POWER: OFF";

        indicator.style.color =
            "#ff7777";

        button.textContent =
            "🔴 電源";

        button.classList.remove(
            "powerOn"
        );

        button.classList.add(
            "powerOff"
        );

    }

}


function readFile(
    file
){

    return new Promise(
        (resolve,reject)=>{

            if(!file){

                reject(
                    new Error(
                        "ファイルが選択されていません。"
                    )
                );

                return;
            }


            const reader =
                new FileReader();


            reader.onload =
                () => resolve(
                    reader.result
                );


            reader.onerror =
                () => reject(
                    new Error(
                        "ファイル読み込み失敗: " +
                        file.name
                    )
                );


            reader.readAsArrayBuffer(
                file
            );

        }
    );
}


function createBlankDisk(
    size
){

    try{

        return new ArrayBuffer(
            size
        );

    }catch(error){

        throw new Error(
            "仮想HDDを作成できませんでした。\n" +
            "ディスクサイズを小さくしてください。\n\n" +
            error.message
        );

    }

}


/* =========================================================
   V86 DETECTION
========================================================= */

function getV86Constructor(){

    if(
        typeof window.V86 ===
        "function"
    ){

        return window.V86;

    }


    if(
        typeof window.V86Starter ===
        "function"
    ){

        return window.V86Starter;

    }


    return null;

}


/* =========================================================
   DIAGNOSTICS
========================================================= */

async function checkFile(
    url
){

    try{

        const response =
            await fetch(
                url,
                {
                    method:"HEAD",
                    cache:"no-store"
                }
            );


        return response.ok;

    }catch(_){

        return false;

    }

}


async function runDiagnostics(){

    const d =
        $("diagnostics");


    let html = "";


    if(
        getV86Constructor()
    ){

        html +=
            '<span class="ok">[✓] libv86.js</span><br>';

    }else{

        html +=
            '<span class="bad">[✗] libv86.js</span><br>';

    }


    if(
        typeof WebAssembly !==
        "undefined"
    ){

        html +=
            '<span class="ok">[✓] WebAssembly</span><br>';

    }else{

        html +=
            '<span class="bad">[✗] WebAssembly</span><br>';

    }


    if(
        location.protocol ===
        "file:"
    ){

        html +=
            '<span class="warn">[!] file://</span><br>';

        html +=
            '<span class="warn">' +
            '    HTTPサーバー経由を推奨' +
            '</span><br>';

    }else{

        html +=
            '<span class="ok">[✓] HTTP/HTTPS</span><br>';

    }


    /*
      v86本体に必要なファイル。
    */

    if(
        location.protocol !==
        "file:"
    ){

        for(
            const file of [
                "v86.wasm",
                "seabios.bin",
                "vgabios.bin"
            ]
        ){

            const exists =
                await checkFile(
                    "./" + file
                );


            if(exists){

                html +=
                    '<span class="ok">' +
                    '[✓] ' +
                    file +
                    '</span><br>';

            }else{

                html +=
                    '<span class="bad">' +
                    '[✗] ' +
                    file +
                    '</span><br>';

            }

        }

    }else{

        html +=
            '<span class="warn">' +
            '[?] v86.wasm / BIOS — HTTP環境で確認' +
            '</span>';

    }


    d.innerHTML =
        html;

}


/* =========================================================
   PROFILE
========================================================= */

function getProfile(){

    const architecture =
        $("architecture").value;

    const os =
        $("osProfile").value;


    /*
      現在のv86はx86。
      x86-64はまだ別バックエンドが必要。
    */

    if(
        architecture ===
        "x64"
    ){

        return {
            supported:false,
            reason:
                "現在のv86はx86-64 CPUを実装していません。"
        };

    }


    let ram =
        Number(
            $("ram").value
        );


    let acpi =
        false;


    if(
        os === "win95"
    ){

        ram =
            Math.min(
                Math.max(
                    ram,
                    64 * 1024 * 1024
                ),
                512 * 1024 * 1024
            );

        acpi =
            false;

    }


    if(
        os === "winxp"
    ){

        ram =
            Math.max(
                ram,
                128 * 1024 * 1024
            );

        /*
          ACPIはv86ではexperimentalなので
          XPプロファイルでも最初はOFF。
        */

        acpi =
            false;

    }


    return {
        supported:true,
        ram,
        acpi
    };

}


/* =========================================================
   FULLSCREEN
========================================================= */

async function enterFullscreen(){

    try{

        if(
            document.fullscreenElement
        ){

            return;

        }


        if(
            $("emulator").requestFullscreen
        ){

            await $("emulator")
                .requestFullscreen();

        }

    }catch(error){

        console.warn(
            "Fullscreen:",
            error
        );

    }

}


/* =========================================================
   POWER ON
========================================================= */

async function powerOn(){

    /*
      既にインスタンスが存在している場合は
      「電源ON」ではなく再開。
    */

    if(
        emulator
    ){

        try{

            if(
                typeof emulator.run ===
                "function"
            ){

                await emulator.run();

                poweredOn =
                    true;

                paused =
                    false;

                setPowerState(
                    true
                );

                $("runPause").textContent =
                    "⏸ 一時停止";

                return;

            }

        }catch(error){

            console.error(
                error
            );

        }

    }


    await bootNewEmulator();

}


/* =========================================================
   CREATE + BOOT
========================================================= */

async function bootNewEmulator(){

    const Constructor =
        getV86Constructor();


    if(!Constructor){

        setStatus(
            "❌ libv86.jsが読み込まれていません。",
            "error"
        );

        return;

    }


    const profile =
        getProfile();


    if(
        !profile.supported
    ){

        setStatus(
            "⚠️ 64-bitモードは現在使用できません。\n\n" +
            profile.reason,
            "warn"
        );

        return;

    }


    const isoFile =
        $("iso").files[0];


    if(!isoFile){

        setStatus(
            "❌ ISOを選択してください。",
            "error"
        );

        return;

    }


    $("boot").disabled =
        true;


    $("menu").style.display =
        "none";

    $("emulator").style.display =
        "block";

    $("bootOverlay").style.display =
        "flex";


    /*
      ブラウザのユーザー操作直後に要求。
    */

    enterFullscreen();


    try{

        /* =============================================
           ISO
        ============================================== */

        setBootText(
            "ISOを読み込んでいます..."
        );


        const iso =
            await readFile(
                isoFile
            );


        /* =============================================
           HDD
        ============================================== */

        let hdd;


        const hddFile =
            $("hdd").files[0];


        if(hddFile){

            setBootText(
                "HDDイメージを読み込んでいます..."
            );


            hdd =
                await readFile(
                    hddFile
                );

        }else{

            setBootText(
                "仮想HDDを作成しています..."
            );


            hdd =
                createBlankDisk(
                    Number(
                        $("diskSize").value
                    )
                );

        }


        /* =============================================
           FLOPPY
        ============================================== */

        let fda =
            null;


        const fdaFile =
            $("fda").files[0];


        if(fdaFile){

            setBootText(
                "フロッピーを読み込んでいます..."
            );


            fda =
                await readFile(
                    fdaFile
                );

        }


        /* =============================================
           V86
        ============================================== */

        setBootText(
            "v86を初期化しています..."
        );


        const options = {

            /*
             * ★ 前版の重要なバグ修正
             *
             * これが抜けていた。
             */
            wasm_path:
                "./v86.wasm",


            memory_size:
                profile.ram,


            vga_memory_size:
                8 * 1024 * 1024,


            /*
             * 旧API互換。
             * 現行v86でも利用可能。
             */
            screen_container:
                $("screen"),


            bios:{
                url:
                    "./seabios.bin"
            },


            vga_bios:{
                url:
                    "./vgabios.bin"
            },


            /*
             * CD -> Floppy -> HDD
             */
            boot_order:
                0x213,


            cdrom:{
                buffer:
                    iso
            },


            hda:{
                buffer:
                    hdd
            },


            acpi:
                profile.acpi,


            /*
             * 自動起動OFF。
             * 作成後に明示的にrun()する。
             */
            autostart:
                false
        };


        if(fda){

            options.fda = {
                buffer:
                    fda
            };

        }


        /*
         * 念のため古いインスタンスを破棄。
         */

        await destroyEmulator();


        setBootText(
            "仮想PCの電源を入れています..."
        );


        /*
         * ★ ここで実際のインスタンスを作る。
         */

        const instance =
            new Constructor(
                options
            );


        emulator =
            instance;


        /*
         * イベント
         */

        if(
            typeof instance.add_listener ===
            "function"
        ){

            instance.add_listener(
                "emulator-ready",
                ()=>{
                    console.log(
                        "[superEmulator] emulator-ready"
                    );
                }
            );


            instance.add_listener(
                "emulator-started",
                ()=>{
                    console.log(
                        "[superEmulator] emulator-started"
                    );
                }
            );


            instance.add_listener(
                "emulator-stopped",
                ()=>{
                    console.log(
                        "[superEmulator] emulator-stopped"
                    );
                }
            );


            instance.add_listener(
                "download-error",
                event=>{
                    console.error(
                        "[superEmulator] download-error",
                        event
                    );
                }
            );

        }


        /*
         * ★ 実際にCPUを動かす。
         */

        await instance.run();


        poweredOn =
            true;

        paused =
            false;


        setPowerState(
            true
        );


        $("runPause").textContent =
            "⏸ 一時停止";


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    1000
                )
        );


        $("bootOverlay").style.display =
            "none";


        setStatus(
            "✓ 起動処理を開始しました。\n" +
            "ISO: " +
            isoFile.name,
            "ok"
        );


    }catch(error){

        console.error(
            "[superEmulator]",
            error
        );


        $("bootOverlay").style.display =
            "none";


        poweredOn =
            false;


        setPowerState(
            false
        );


        setStatus(
            "❌ エミュレーターを起動できませんでした。\n\n" +
            (error?.message || String(error)) +
            "\n\n" +
            "確認:\n" +
            "・v86.wasm\n" +
            "・seabios.bin\n" +
            "・vgabios.bin\n" +
            "・ISOがブート可能か\n" +
            "・Windows 95ならブートフロッピーが必要か",
            "error"
        );


        await destroyEmulator();


    }finally{

        $("boot").disabled =
            false;

    }

}


/* =========================================================
   POWER OFF
========================================================= */

async function powerOff(){

    if(
        !emulator
    ){

        setPowerState(
            false
        );

        return;

    }


    try{

        /*
         * v86公式APIのstop()を使用。
         * stop()はエミュレーションを停止する。
         */

        if(
            typeof emulator.stop ===
            "function"
        ){

            await emulator.stop();

        }


    }catch(error){

        console.error(
            "Power off:",
            error
        );

    }


    poweredOn =
        false;

    paused =
        false;


    setPowerState(
        false
    );


    $("runPause").textContent =
        "▶ 再開";


    setStatus(
        "🔴 電源OFF\n" +
        "エミュレーターは停止しています。",
        "warn"
    );

}


/* =========================================================
   DESTROY
========================================================= */

async function destroyEmulator(){

    const instance =
        emulator;


    emulator =
        null;


    if(
        !instance
    ){

        return;

    }


    try{

        if(
            typeof instance.destroy ===
            "function"
        ){

            await instance.destroy();

        }else if(
            typeof instance.stop ===
            "function"
        ){

            await instance.stop();

        }

    }catch(error){

        console.warn(
            "destroy:",
            error
        );

    }


    poweredOn =
        false;

    paused =
        false;

}


/* =========================================================
   RESET
========================================================= */

async function resetEmulator(){

    /*
     * ★ undefined.restart バグ対策
     *
     * まずローカル変数に取得してから確認する。
     */

    const instance =
        emulator;


    if(
        !instance
    ){

        setStatus(
            "⚠️ エミュレーターの電源がOFFです。\n" +
            "先に電源ボタンを押してください。",
            "warn"
        );

        return;

    }


    try{

        /*
         * 現在のv86 APIではrestart()は
         * インスタンスメソッド。
         */

        if(
            typeof instance.restart ===
            "function"
        ){

            instance.restart();


            poweredOn =
                true;

            paused =
                false;


            setPowerState(
                true
            );


            $("runPause").textContent =
                "⏸ 一時停止";


            setStatus(
                "🔄 リセットしました。",
                "ok"
            );


            return;

        }


        /*
         * restart()が存在しない古いランタイム用。
         */

        if(
            typeof instance.stop ===
            "function"
        ){

            await instance.stop();

        }


        if(
            typeof instance.run ===
            "function"
        ){

            await instance.run();

        }


        poweredOn =
            true;

        paused =
            false;


        setPowerState(
            true
        );


        $("runPause").textContent =
            "⏸ 一時停止";


        setStatus(
            "🔄 リセットしました。",
            "ok"
        );


    }catch(error){

        console.error(
            "Reset error:",
            error
        );


        setStatus(
            "❌ リセットに失敗しました。\n\n" +
            (error?.message || String(error)),
            "error"
        );

    }

}


/* =========================================================
   PAUSE / RESUME
========================================================= */

async function togglePause(){

    const instance =
        emulator;


    if(
        !instance
    ){

        setStatus(
            "⚠️ エミュレーターがありません。",
            "warn"
        );

        return;

    }


    try{

        if(
            !paused
        ){

            if(
                typeof instance.stop ===
                "function"
            ){

                await instance.stop();

            }


            paused =
                true;

            poweredOn =
                false;


            setPowerState(
                false
            );


            $("runPause").textContent =
                "▶ 再開";


            setStatus(
                "⏸ 一時停止中",
                "warn"
            );


        }else{

            if(
                typeof instance.run ===
                "function"
            ){

                await instance.run();

            }


            paused =
                false;

            poweredOn =
                true;


            setPowerState(
                true
            );


            $("runPause").textContent =
                "⏸ 一時停止";


            setStatus(
                "▶ 再開しました。",
                "ok"
            );

        }

    }catch(error){

        console.error(
            error
        );

        setStatus(
            "❌ 状態変更に失敗しました。\n\n" +
            (error?.message || String(error)),
            "error"
        );

    }

}


/* =========================================================
   EXIT
========================================================= */

async function exitEmulator(){

    await destroyEmulator();


    $("emulator").style.display =
        "none";


    $("menu").style.display =
        "flex";


    setPowerState(
        false
    );


    if(
        document.fullscreenElement
    ){

        try{

            await document.exitFullscreen();

        }catch(_){}

    }


    setStatus(
        "エミュレーターを終了しました。",
        "warn"
    );

}


/* =========================================================
   EVENTS
========================================================= */

$("boot").addEventListener(
    "click",
    powerOn
);


$("power").addEventListener(
    "click",
    async ()=>{

        if(poweredOn){

            await powerOff();

        }else{

            await powerOn();

        }

    }
);


$("reset").addEventListener(
    "click",
    resetEmulator
);


$("runPause").addEventListener(
    "click",
    togglePause
);


$("fullscreen").addEventListener(
    "click",
    enterFullscreen
);


$("exit").addEventListener(
    "click",
    exitEmulator
);


/* =========================================================
   PROFILE EVENTS
========================================================= */

$("architecture").addEventListener(
    "change",
    ()=>{

        if(
            $("architecture").value ===
            "x64"
        ){

            setStatus(
                "⚠️ 64-bitを選択しました。\n\n" +
                "現在のv86バックエンドはx86-64非対応です。",
                "warn"
            );

        }

    }
);


$("osProfile").addEventListener(
    "change",
    ()=>{

        const os =
            $("osProfile").value;


        if(
            os === "win10" ||
            os === "win11"
        ){

            $("architecture").value =
                "x64";


            setStatus(
                "⚠️ Windows 10/11は64-bitバックエンドが必要です。\n" +
                "現在のv86ではまだ起動できません。",
                "warn"
            );

        }

    }
);


/* =========================================================
   STARTUP
========================================================= */

window.addEventListener(
    "load",
    async ()=>{

        setPowerState(
            false
        );


        await runDiagnostics();


        if(
            getV86Constructor()
        ){

            setStatus(
                "✓ v86を検出しました。\n" +
                "ISOを選択して起動してください。",
                "ok"
            );

        }else{

            setStatus(
                "❌ libv86.jsを読み込めません。",
                "error"
            );

        }

    }
);


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
    "keydown",
    event=>{

        if(
            $("emulator").style.display !==
            "block"
        ){

            return;

        }


        if(
            event.key ===
            "F11"
        ){

            event.preventDefault();

            enterFullscreen();

        }

    }
);

</script>
