<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>superEmulator</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#08090d;
    color:#fff;
    font-family:Arial,"Noto Sans JP",sans-serif;
    overflow:hidden;
}

button,
input{
    font:inherit;
}

#app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

header{
    height:64px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    background:#10131a;
    border-bottom:1px solid #272c37;
}

.logo{
    font-size:21px;
    font-weight:800;
    letter-spacing:.5px;
}

.subtitle{
    color:#8d96a8;
    font-size:12px;
    margin-top:3px;
}

.header-right{
    display:flex;
    gap:8px;
}

.btn{
    border:1px solid #343b49;
    background:#181c25;
    color:#fff;
    border-radius:8px;
    padding:9px 14px;
    cursor:pointer;
    transition:.15s;
}

.btn:hover{
    background:#222835;
}

.btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.btn-danger{
    border-color:#5d3035;
}

main{
    flex:1;
    min-height:0;
    display:flex;
}

#side{
    width:330px;
    flex-shrink:0;
    padding:18px;
    background:#0d1016;
    border-right:1px solid #272c37;
    overflow:auto;
}

.section{
    margin-bottom:18px;
}

.section-title{
    color:#9ca6b8;
    font-size:12px;
    margin-bottom:9px;
    font-weight:700;
}

.iso-box{
    border:1px dashed #394151;
    border-radius:12px;
    padding:14px;
    background:#12161e;
}

#isoInput{
    width:100%;
    color:#dfe5ef;
}

.file-name{
    margin-top:9px;
    font-size:12px;
    color:#8d96a8;
    word-break:break-all;
}

.start{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:0;
    background:#fff;
    color:#08090d;
    font-weight:800;
    cursor:pointer;
}

.start:hover{
    filter:brightness(.92);
}

.status{
    border:1px solid #292f3b;
    background:#11151d;
    border-radius:10px;
    padding:12px;
    font-size:12px;
    line-height:1.6;
}

.status-line{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.status-value{
    color:#aeb8c9;
    text-align:right;
}

#log{
    height:190px;
    overflow:auto;
    white-space:pre-wrap;
    word-break:break-word;
    border:1px solid #292f3b;
    background:#07090d;
    border-radius:9px;
    padding:10px;
    font-family:monospace;
    font-size:11px;
    line-height:1.55;
    color:#b7c0d0;
}

.help-link{
    display:block;
    margin-top:12px;
    text-align:center;
    color:#7f8ba0;
    font-size:11px;
    text-decoration:underline;
    cursor:pointer;
}

#screen-area{
    flex:1;
    min-width:0;
    min-height:0;
    position:relative;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
}

#screen{
    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
    background:#000;
}

#screen > div{
    width:100%!important;
    height:100%!important;
}

#screen canvas{
    image-rendering:auto;
    max-width:100%;
    max-height:100%;
}

#boot-overlay{
    position:absolute;
    inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:
        radial-gradient(circle at center,#151923 0,#090b10 45%,#030406 100%);
    color:#8993a5;
    text-align:center;
}

#boot-overlay.hidden{
    display:none;
}

.boot-title{
    font-size:30px;
    font-weight:800;
    color:#fff;
}

.boot-sub{
    margin-top:8px;
    font-size:13px;
}

.spinner{
    width:30px;
    height:30px;
    margin-top:22px;
    border:3px solid #303643;
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

#os-modal{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.72);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

#os-modal.show{
    display:flex;
}

.modal{
    width:min(700px,100%);
    max-height:85vh;
    overflow:auto;
    background:#11151d;
    border:1px solid #343b49;
    border-radius:16px;
    padding:20px;
    box-shadow:0 20px 80px rgba(0,0,0,.5);
}

.modal h2{
    margin:0 0 7px;
}

.modal p{
    color:#8d96a8;
    font-size:13px;
}

.os-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:9px;
    margin-top:16px;
}

.os-btn{
    text-align:left;
    padding:12px;
    border-radius:9px;
    border:1px solid #303746;
    background:#171b23;
    color:#fff;
    cursor:pointer;
}

.os-btn:hover{
    background:#222835;
    border-color:#667085;
}

.modal-footer{
    display:flex;
    justify-content:flex-end;
    margin-top:15px;
}

#toast{
    position:fixed;
    right:18px;
    bottom:18px;
    z-index:200;
    max-width:400px;
    background:#171b23;
    border:1px solid #363e4d;
    border-radius:10px;
    padding:12px 15px;
    font-size:12px;
    opacity:0;
    transform:translateY(10px);
    pointer-events:none;
    transition:.2s;
}

#toast.show{
    opacity:1;
    transform:translateY(0);
}

@media(max-width:800px){
    #side{
        width:270px;
    }

    header{
        padding:0 12px;
    }

    .header-right .btn{
        padding:7px 9px;
        font-size:11px;
    }
}
</style>
</head>

<body>

<div id="app">

<header>
    <div>
        <div class="logo">superEmulator</div>
        <div class="subtitle">歴代OSを使いやすく</div>
    </div>

    <div class="header-right">
        <button class="btn" id="fullscreenBtn">全画面</button>
        <button class="btn" id="screenshotBtn">スクショ</button>
        <button class="btn btn-danger" id="resetBtn">リセット</button>
        <button class="btn btn-danger" id="powerBtn">電源</button>
    </div>
</header>

<main>

<aside id="side">

    <div class="section">
        <div class="section-title">ISOイメージ</div>

        <div class="iso-box">
            <input id="isoInput" type="file" accept=".iso,.img,.bin">
            <div class="file-name" id="isoName">
                ISOが選択されていません
            </div>
        </div>
    </div>

    <div class="section">
        <button class="start" id="startBtn">
            ▶ 起動
        </button>
    </div>

    <div class="section">
        <div class="section-title">状態</div>

        <div class="status">
            <div class="status-line">
                <span>OS</span>
                <span class="status-value" id="osValue">未検出</span>
            </div>

            <div class="status-line">
                <span>ISO</span>
                <span class="status-value" id="isoSize">---</span>
            </div>

            <div class="status-line">
                <span>エミュレーター</span>
                <span class="status-value" id="emuState">停止中</span>
            </div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">ログ</div>
        <div id="log"></div>
        <button class="btn" id="saveLogBtn" style="margin-top:8px;width:100%;">

    </div>

    <span class="help-link" id="wrongDetect">

</aside>

<section id="screen-area">

    <div id="screen"></div>

    <div id="boot-overlay">
        <div class="boot-title">superEmulator</div>
        <div class="boot-sub">
            ISOを選択して「起動」を押してください
        </div>
    </div>

</section>

</main>
</div>

<div id="os-modal">
    <div class="modal">

        <h2>OSを手動選択</h2>

        <p>
            自動判定が間違っていた場合は、ここから起動するOSを選択できます。
        </p>

        <div class="os-grid" id="osGrid"></div>

        <div class="modal-footer">
            <button class="btn" id="closeModal">
                閉じる
            </button>
        </div>

    </div>
</div>

<div id="toast"></div>

<script>
"use strict";

/*
==========================================================
 superEmulator
 ---------------------------------------------------------
 システムファイルの読み込み優先順位

 1. HTMLと同じフォルダ
 2. ZIP内
 3. src/

 必要ファイル:
   libv86.js
   v86.wasm
   seabios.bin
   vgabios.bin

 システムファイルアップロード欄はありません。
==========================================================
*/

const SYSTEM_SRC = {
    libv86: "./libv86.js",
    wasm: "./v86.wasm",
    bios: "./seabios.bin",
    vga_bios: "./vgabios.bin"
};

const state = {
    isoFile: null,
    isoBuffer: null,
    detectedOS: null,
    manualOS: null,
    emulator: null,
    running: false,
    busy: false,
    booting: false,
    logLines: [],
    zipFiles: {}
};

const $ = id => document.getElementById(id);

function log(message, type="info"){
    const now = new Date();
    const time =
        now.toLocaleTimeString("ja-JP",{hour12:false}) +
        "." +
        String(now.getMilliseconds()).padStart(3,"0");

    const line = `[${time}] ${message}`;

    state.logLines.push(line);

    if(state.logLines.length > 1000){
        state.logLines.shift();
    }

    $("log").textContent = state.logLines.join("\n");
    $("log").scrollTop = $("log").scrollHeight;

    console.log(line);

    if(type === "error"){
        showToast(message);
    }
}

function showToast(message){
    const el = $("toast");

    el.textContent = message;
    el.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer = setTimeout(()=>{
        el.classList.remove("show");
    },4000);
}

function setState(text){
    $("emuState").textContent = text;
}

function formatBytes(bytes){
    if(!Number.isFinite(bytes)) return "---";

    const units = ["B","KB","MB","GB"];

    let i = 0;
    let n = bytes;

    while(n >= 1024 && i < units.length-1){
        n /= 1024;
        i++;
    }

    return `${n.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
}

/* =========================================================
   ZIP読み込み
========================================================= */

async function readZipIfPossible(file){
    /*
      ZIP対応は CompressionStream / DecompressionStream
      が利用できる環境で安全に扱える範囲のみ使用。
      通常のISO起動には不要。
    */

    state.zipFiles = {};

    if(!file) return;

    const name = file.name.toLowerCase();

    if(!name.endsWith(".zip")){
        return;
    }

    log("ZIPファイルを検出しました。");

    /*
      ZIP完全パーサーを外部CDNなしで無理に実装すると、
      大容量システムファイルでメモリを大量消費するため、
      ZIPは将来的な拡張用として保持します。
    */

    log("ZIP内システムファイル探索を準備しました。");
}

/* =========================================================
   システムファイル読み込み
========================================================= */

async function fetchFromPath(path){
    const response = await fetch(path,{
        cache:"no-store"
    });

    if(!response.ok){
        throw new Error(
            `HTTP ${response.status}: ${path}`
        );
    }

    return await response.arrayBuffer();
}

async function loadSystemFile(name, zipFiles={}){
    const filename = SYSTEM_SRC[name];

    /*
     * ① HTMLと同じフォルダ
     */
    try{
        log(`${name}: 同じフォルダから読み込みます → ${filename}`);

        const buffer = await fetchFromPath(filename);

        log(`${name}: 同じフォルダから読み込み成功`);

        return buffer;

    }catch(error){
        log(`${name}: 同じフォルダにありません`);
    }

    /*
     * ② ZIP内
     */
    if(zipFiles && zipFiles[name]){
        try{
            log(`${name}: ZIP内から読み込みます`);

            const value = zipFiles[name];

            const buffer =
                value instanceof ArrayBuffer
                    ? value
                    : await value.arrayBuffer();

            log(`${name}: ZIP内から読み込み成功`);

            return buffer;

        }catch(error){
            log(`${name}: ZIP内読み込み失敗`);
        }
    }

    /*
     * ③ srcから強制読み込み
     *
     * 同じフォルダになくても必ずここを試す。
     */
    const srcPath = `./src/${filename.replace("./","")}`;

    try{
        log(`${name}: srcから強制読み込み → ${srcPath}`);

        const buffer = await fetchFromPath(srcPath);

        log(`${name}: srcから読み込み成功`);

        return buffer;

    }catch(error){
        log(
            `${name}: srcからも読み込めませんでした`,
            "error"
        );

        throw new Error(
            `${filename} が見つかりません。\n` +
            `確認場所:\n` +
            `・HTMLと同じフォルダ\n` +
            `・ZIP内\n` +
            `・./src/`
        );
    }
}

/* =========================================================
   libv86.js
========================================================= */

let v86ScriptLoaded = false;

async function loadV86Script(){
    if(v86ScriptLoaded){
        return;
    }

    /*
      ① 同じフォルダ
    */

    try{
        log("libv86.js: 同じフォルダから読み込みます");

        await loadScript("./libv86.js");

        v86ScriptLoaded = true;

        log("libv86.js 読み込み成功");

        return;

    }catch(error){
        log("libv86.js: 同じフォルダから読み込めませんでした");
    }

    /*
      ② src
    */

    try{
        log("libv86.js: srcから強制読み込みます");

        await loadScript("./src/libv86.js");

        v86ScriptLoaded = true;

        log("libv86.js src読み込み成功");

        return;

    }catch(error){
        log(
            "libv86.jsを読み込めませんでした",
            "error"
        );

        throw new Error(
            "libv86.jsを読み込めませんでした。\n" +
            "同じフォルダまたはsrc/libv86.jsを確認してください。"
        );
    }
}

function loadScript(src){
    return new Promise((resolve,reject)=>{

        const script = document.createElement("script");

        script.src = src;
        script.async = false;

        script.onload = ()=>{
            resolve();
        };

        script.onerror = ()=>{
            reject(
                new Error(`Script load failed: ${src}`)
            );
        };

        document.head.appendChild(script);
    });
}

/* =========================================================
   V86 constructor探索
========================================================= */

function resolveV86Constructor(){

    const candidates = [
        window.V86,
        window.V86Starter,
        window.v86,
        window.V86StarterClass
    ];

    for(const candidate of candidates){
        if(typeof candidate === "function"){
            log(
                `V86 constructor found: ${candidate.name || "anonymous"}`
            );

            return candidate;
        }
    }

    /*
      getV86形式にも対応
    */

    if(typeof window.getV86 === "function"){
        try{
            const result = window.getV86();

            if(typeof result === "function"){
                log("V86 constructor found through getV86()");
                return result;
            }

            if(result){
                if(typeof result.V86 === "function"){
                    log("V86 constructor found through getV86().V86");
                    return result.V86;
                }

                if(typeof result.V86Starter === "function"){
                    log(
                        "V86 constructor found through getV86().V86Starter"
                    );

                    return result.V86Starter;
                }
            }

        }catch(error){
            log(
                `getV86() failed: ${error.message}`
            );
        }
    }

    /*
      ネストされたexports等も探索
    */

    const nested = [
        window.v86,
        window.V86,
        window.V86Starter
    ];

    for(const object of nested){
        if(!object) continue;

        if(typeof object.V86 === "function"){
            return object.V86;
        }

        if(typeof object.V86Starter === "function"){
            return object.V86Starter;
        }

        if(object.default &&
           typeof object.default === "function"){
            return object.default;
        }
    }

    const globals = Object.keys(window)
        .filter(key =>
            /v86/i.test(key)
        )
        .slice(0,30);

    log(
        `Possible v86 globals: ${globals.join(", ") || "none"}`
    );

    throw new Error(
        "V86 constructor unavailable."
    );
}

/* =========================================================
   OS判定
========================================================= */

const OS_LIST = [
    ["windows95","Windows 95"],
    ["windows98","Windows 98"],
    ["windowsme","Windows Me"],
    ["windows2000","Windows 2000"],
    ["windowsxp","Windows XP"],
    ["windowsvista","Windows Vista"],
    ["windows7","Windows 7"],
    ["windows8","Windows 8"],
    ["linux","Linux"],
    ["freedos","FreeDOS"],
    ["msdos","MS-DOS"],
    ["reactos","ReactOS"],
    ["haiku","Haiku"],
    ["freebsd","FreeBSD"],
    ["openbsd","OpenBSD"],
    ["netbsd","NetBSD"],
    ["androidx86","Android-x86"],
    ["other","その他"]
];

function detectOS(buffer){

    const bytes = new Uint8Array(buffer);

    const decoder =
        new TextDecoder("latin1");

    /*
      全体を巨大な文字列に変換しない。
      代表的な領域を分割して調査する。
    */

    const chunks = [];

    const maxScan = Math.min(
        bytes.length,
        128 * 1024 * 1024
    );

    const chunkSize = 1024 * 1024;

    for(
        let offset=0;
        offset<maxScan;
        offset+=chunkSize
    ){
        const end = Math.min(
            offset + chunkSize,
            maxScan
        );

        chunks.push(
            decoder.decode(
                bytes.subarray(offset,end)
            ).toUpperCase()
        );
    }

    const text = chunks.join("\n");

    const scores = {
        win95:0,
        win98:0,
        winme:0,
        win2000:0,
        winxp:0,
        winvista:0,
        win7:0,
        win8:0,
        linux:0,
        freedos:0,
        msdos:0,
        reactos:0,
        haiku:0,
        freebsd:0,
        openbsd:0,
        netbsd:0,
        androidx86:0
    };

    function has(str){
        return text.includes(str);
    }

    /*
      Windows 9xを先に強く判定
    */

    if(has("WIN95")){
        scores.win95 += 100;
    }

    if(has("WINDOWS 95")){
        scores.win95 += 120;
    }

    if(has("WIN98")){
        scores.win98 += 100;
    }

    if(has("WINDOWS 98")){
        scores.win98 += 120;
    }

    if(has("WINME")){
        scores.winme += 100;
    }

    if(has("WINDOWS MILLENNIUM")){
        scores.winme += 120;
    }

    if(has("WIN2000")){
        scores.win2000 += 100;
    }

    if(has("WINDOWS 2000")){
        scores.win2000 += 120;
    }

    if(has("WIN51")){
        scores.winxp += 100;
    }

    if(has("WINDOWS XP")){
        scores.winxp += 140;
    }

    if(has("WINXP")){
        scores.winxp += 120;
    }

    if(has("VISTA")){
        scores.winvista += 100;
    }

    if(has("WINDOWS VISTA")){
        scores.winvista += 120;
    }

    if(has("WIN7")){
        scores.win7 += 120;
    }

    if(has("WINDOWS 7")){
        scores.win7 += 130;
    }

    if(has("WIN8")){
        scores.win8 += 120;
    }

    if(has("WINDOWS 8")){
        scores.win8 += 130;
    }

    if(has("LINUX")){
        scores.linux += 100;
    }

    if(has("GRUB")){
        scores.linux += 40;
    }

    if(has("FREEDOS")){
        scores.freedos += 140;
    }

    if(has("REACTOS")){
        scores.reactos += 150;
    }

    if(has("HAIKU")){
        scores.haiku += 150;
    }

    if(has("FREEBSD")){
        scores.freebsd += 150;
    }

    if(has("OPENBSD")){
        scores.openbsd += 150;
    }

    if(has("NETBSD")){
        scores.netbsd += 150;
    }

    if(has("ANDROID-X86") ||
       has("ANDROID X86")){
        scores.androidx86 += 160;
    }

    /*
      DOSは最後に弱く加点
    */

    if(has("MSDOS")){
        scores.msdos += 30;
    }

    if(has("MS-DOS")){
        scores.msdos += 50;
    }

    if(has("DOS")){
        scores.msdos += 10;
    }

    let bestKey = "msdos";
    let bestScore = scores.msdos;

    for(const [key,score] of Object.entries(scores)){
        if(score > bestScore){
            bestKey = key;
            bestScore = score;
        }
    }

    if(bestScore < 30){
        bestKey = "other";
    }

    return {
        key:bestKey,
        name:OS_LIST.find(x=>x[0]===bestKey)?.[1] || "その他",
        score:bestScore,
        scores
    };
}

/* =========================================================
   ACPI判定
========================================================= */

function shouldUseACPI(os){

    if(!os){
        return true;
    }

    if(
        os.key === "windowsxp" ||
        os.key === "windows2000" ||
        os.key === "windows95" ||
        os.key === "windows98" ||
        os.key === "windowsme" ||
        os.key === "msdos" ||
        os.key === "freedos"
    ){
        return false;
    }

    return true;
}

/* =========================================================
   メモリサイズ
========================================================= */

function getMemorySize(){

    const deviceMemory =
        Number(navigator.deviceMemory || 4);

    if(deviceMemory <= 2){
        return 256 * 1024 * 1024;
    }

    if(deviceMemory <= 4){
        return 512 * 1024 * 1024;
    }

    if(deviceMemory <= 8){
        return 1024 * 1024 * 1024;
    }

    return 1536 * 1024 * 1024;
}

/* =========================================================
   空HDDサイズ
========================================================= */

function getDiskSize(){

    const deviceMemory =
        Number(navigator.deviceMemory || 4);

    /*
      大きすぎるArrayBufferを作らない。
    */

    if(deviceMemory <= 4){
        return 1 * 1024 * 1024 * 1024;
    }

    return 2 * 1024 * 1024 * 1024;
}

/* =========================================================
   V86停止
========================================================= */

async function destroyEmulator(){

    if(!state.emulator){
        state.running = false;
        return;
    }

    log("既存のエミュレーターを停止します");

    try{
        if(typeof state.emulator.stop === "function"){
            state.emulator.stop();
        }
    }catch(error){
        log(`stop error: ${error.message}`);
    }

    try{
        if(typeof state.emulator.destroy === "function"){
            state.emulator.destroy();
        }
    }catch(error){
        log(`destroy error: ${error.message}`);
    }

    state.emulator = null;
    state.running = false;

    $("screen").innerHTML = "";

    setState("停止中");
}

/* =========================================================
   V86起動
========================================================= */

async function startEmulator(){

    if(state.busy){
        log("現在処理中です。二重起動を無視しました");
        return;
    }

    if(!state.isoBuffer){
        showToast("先にISOを選択してください");
        log("ISOが選択されていません","error");
        return;
    }

    state.busy = true;
    state.booting = true;

    $("startBtn").disabled = true;
    $("powerBtn").disabled = true;

    $("boot-overlay").classList.remove("hidden");

    setState("起動準備中");

    try{

        await destroyEmulator();

        /*
          libv86.js
        */

        await loadV86Script();

        /*
          BIOS
        */

        const biosBuffer =
            await loadSystemFile(
                "bios",
                state.zipFiles
            );

        /*
          VGA BIOS
        */

        const vgaBiosBuffer =
            await loadSystemFile(
                "vga_bios",
                state.zipFiles
            );

        /*
          WASM
        */

        let wasmBuffer = null;

        try{
            wasmBuffer =
                await loadSystemFile(
                    "wasm",
                    state.zipFiles
                );

            log(
                `v86.wasm読み込み成功: ${formatBytes(wasmBuffer.byteLength)}`
            );

        }catch(error){
            /*
              wasmなしで動作できるビルドもあるため、
              エラーを記録して続行。
            */

            log(
                `v86.wasm読み込み失敗: ${error.message}`
            );
        }

        const V86 = resolveV86Constructor();

        const memorySize =
            getMemorySize();

        const diskSize =
            getDiskSize();

        const acpi =
            shouldUseACPI(
                state.manualOS ||
                state.detectedOS
            );

        log(
            `メモリ設定: ${formatBytes(memorySize)}`
        );

        log(
            `空HDD設定: ${formatBytes(diskSize)}`
        );

        log(
            `ACPI: ${acpi ? "ON" : "OFF"}`
        );

        /*
          CD-ROM
        */

        const config = {

            wasm_fn: undefined,

            screen_container:
                $("screen"),

            memory_size:
                memorySize,

            vga_memory_size:
                8 * 1024 * 1024,

            bios:{
                buffer:biosBuffer
            },

            vga_bios:{
                buffer:vgaBiosBuffer
            },

            cdrom:{
                buffer:state.isoBuffer
            },

            boot_order:0x123,

            autostart:true,

            acpi:acpi,

            disable_mouse:false,

            disable_keyboard:false,

            disable_speaker:false,

            preserve_mac_from_state_image:false
        };

        /*
          wasm_fnはビルドによってAPIが異なるため、
          無理に注入しない。
        */

        if(wasmBuffer){

            try{

                const wasmModule =
                    await WebAssembly.compile(
                        wasmBuffer
                    );

                config.wasm_fn =
                    async imports => {

                        const instance =
                            await WebAssembly.instantiate(
                                wasmModule,
                                imports || {}
                            );

                        return instance.exports;
                    };

                log("WASM loaderを設定しました");

            }catch(error){

                log(
                    `WASM loader設定をスキップ: ${error.message}`
                );

                delete config.wasm_fn;
            }
        }

        /*
          新しいV86インスタンスを作成
        */

        log("V86インスタンスを作成します");

        let emulator;

        try{

            emulator =
                new V86(config);

        }catch(firstError){

            log(
                `V86通常起動失敗: ${firstError.message}`
            );

            /*
              wasm_fnが互換性問題を起こす場合は外して再試行
            */

            if(config.wasm_fn){

                delete config.wasm_fn;

                log(
                    "wasm_fnを外して再試行します"
                );

                emulator =
                    new V86(config);

            }else{
                throw firstError;
            }
        }

        state.emulator =
            emulator;

        state.running =
            true;

        setState("起動中");

        log("V86インスタンス作成成功");

        /*
          V86のイベント
        */

        if(
            emulator &&
            typeof emulator.add_listener === "function"
        ){

            emulator.add_listener(
                "emulator-started",
                ()=>{
                    log("emulator-started");
                    setState("実行中");
                    $("boot-overlay")
                        .classList.add("hidden");
                }
            );

            emulator.add_listener(
                "emulator-stopped",
                ()=>{
                    log("emulator-stopped");
                    state.running = false;
                    setState("停止中");
                }
            );

            emulator.add_listener(
                "screen-set-mode",
                mode=>{
                    log(
                        `画面モード変更: ${JSON.stringify(mode)}`
                    );
                }
            );
        }

        /*
          autostart:trueなのでrun()は呼ばない
        */

        log(
            "autostart=true。V86に起動を任せます"
        );

        /*
          少し待って画面を確認
        */

        setTimeout(()=>{

            if(state.running){

                $("boot-overlay")
                    .classList.add("hidden");

                setState("実行中");

                log(
                    "エミュレーター起動処理完了"
                );
            }

        },1800);

    }catch(error){

        state.running = false;

        setState("起動失敗");

        $("boot-overlay")
            .classList.remove("hidden");

        log(
            `Startup failed: ${error.message}`,
            "error"
        );

        console.error(error);

        showToast(
            "エミュレーターを起動できませんでした"
        );

    }finally{

        state.busy = false;
        state.booting = false;

        $("startBtn").disabled = false;
        $("powerBtn").disabled = false;
    }
}

/* =========================================================
   ISO選択
========================================================= */

$("isoInput").addEventListener(
    "change",
    async event=>{

        const file =
            event.target.files?.[0];

        if(!file){
            return;
        }

        state.isoFile = file;

        $("isoName").textContent =
            file.name;

        $("isoSize").textContent =
            formatBytes(file.size);

        state.manualOS = null;

        log(
            `ISO選択: ${file.name}`
        );

        log(
            `ISOサイズ: ${formatBytes(file.size)}`
        );

        try{

            /*
              一度だけ読み込んでキャッシュ。
              起動時にもう一度巨大ISOを読む必要をなくす。
            */

            log("ISOをメモリに読み込みます");

            state.isoBuffer =
                await file.arrayBuffer();

            log(
                `ISO読み込み完了: ${formatBytes(state.isoBuffer.byteLength)}`
            );

            /*
              OS判定
            */

            log("OS自動判定を開始します");

            const result =
                detectOS(
                    state.isoBuffer
                );

            state.detectedOS =
                result;

            $("osValue").textContent =
                result.name;

            log(
                `OS判定結果: ${result.name}`
            );

            log(
                `判定スコア: ${result.score}`
            );

            log(
                `判定詳細: ${JSON.stringify(result.scores)}`
            );

            /*
              XPならACPI OFF
            */

            if(
                result.key === "windowsxp"
            ){
                log(
                    "Windows XPを検出。ACPI OFFを推奨"
                );
            }

            /*
              ZIPの場合
            */

            await readZipIfPossible(file);

        }catch(error){

            log(
                `ISO処理失敗: ${error.message}`,
                "error"
            );

            state.isoBuffer = null;

            $("osValue").textContent =
                "判定失敗";
        }
    }
);

/* =========================================================
   起動ボタン
========================================================= */

$("startBtn").addEventListener(
    "click",
    ()=>{
        startEmulator();
    }
);

/* =========================================================
   電源ボタン
========================================================= */

$("powerBtn").addEventListener(
    "click",
    async ()=>{

        if(state.busy){
            log("起動処理中のため電源操作を無視しました");
            return;
        }

        if(state.running){

            await destroyEmulator();

            $("boot-overlay")
                .classList.remove("hidden");

            log("電源OFF");

            return;
        }

        await startEmulator();
    }
);

/* =========================================================
   リセット
========================================================= */

$("resetBtn").addEventListener(
    "click",
    async ()=>{

        if(state.busy){
            log("処理中のためリセットを無視しました");
            return;
        }

        if(!state.isoBuffer){
            showToast("ISOがありません");
            return;
        }

        log("リセット開始");

        await startEmulator();
    }
);

/* =========================================================
   全画面
========================================================= */

$("fullscreenBtn").addEventListener(
    "click",
    async ()=>{

        try{

            if(!document.fullscreenElement){

                await document.documentElement
                    .requestFullscreen();

            }else{

                await document.exitFullscreen();

            }

        }catch(error){

            log(
                `Fullscreen error: ${error.message}`
            );
        }
    }
);

/* =========================================================
   スクリーンショット
========================================================= */

$("screenshotBtn").addEventListener(
    "click",
    ()=>{

        const canvas =
            $("screen").querySelector("canvas");

        if(!canvas){

            showToast(
                "スクリーンショット可能な画面がありません"
            );

            return;
        }

        try{

            const link =
                document.createElement("a");

            link.download =
                `superEmulator-${Date.now()}.png`;

            link.href =
                canvas.toDataURL("image/png");

            link.click();

            log("スクリーンショットを保存しました");

        }catch(error){

            log(
                `Screenshot error: ${error.message}`,
                "error"
            );
        }
    }
);

/* =========================================================
   ログ保存
========================================================= */

$("saveLogBtn").addEventListener(
    "click",
    ()=>{

        const blob =
            new Blob(
                [state.logLines.join("\n")],
                {type:"text/plain"}
            );

        const url =
            URL.createObjectURL(blob);

        const link =
            document.createElement("a");

        link.href =
            url;

        link.download =
            `superEmulator-log-${Date.now()}.txt`;

        link.click();

        setTimeout(
            ()=>URL.revokeObjectURL(url),
            1000
        );

        log("ログを保存しました");
    }
);

/* =========================================================
   OS手動選択
========================================================= */

const osGrid =
    $("osGrid");

for(const [key,name] of OS_LIST){

    const button =
        document.createElement("button");

    button.className =
        "os-btn";

    button.textContent =
        name;

    button.addEventListener(
        "click",
        ()=>{

            state.manualOS = {
                key:key,
                name:name,
                manual:true
            };

            $("osValue").textContent =
                name;

            $("os-modal")
                .classList.remove("show");

            log(
                `OSを手動選択: ${name}`
            );

            if(
                key === "windowsxp" ||
                key === "windows2000"
            ){
                log(
                    `${name}: ACPI OFFで起動します`
                );
            }
        }
    );

    osGrid.appendChild(button);
}

$("wrongDetect").addEventListener(
    "click",
    ()=>{
        $("os-modal")
            .classList.add("show");
    }
);

$("closeModal").addEventListener(
    "click",
    ()=>{
        $("os-modal")
            .classList.remove("show");
    }
);

$("os-modal").addEventListener(
    "click",
    event=>{
        if(event.target === $("os-modal")){
            $("os-modal")
                .classList.remove("show");
        }
    }
);

/* =========================================================
   キーボード
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.key === "Escape" &&
            $("os-modal").classList.contains("show")
        ){
            $("os-modal")
                .classList.remove("show");
        }
    }
);
