<script>
"use strict";

/* ==========================================================
   superEmulator
   Main Application
========================================================== */

let emulator = null;

let emulatorRunning = false;


/* ==========================================================
   Helpers
========================================================== */

const $ = id =>
    document.getElementById(id);


function status(
    message,
    type = ""
){

    const el = $("status");

    el.textContent = message;

    el.className =
        "status " + type;
}


function bootMessage(
    message
){

    $("bootMessage").textContent =
        message;
}


function fileBuffer(
    file
){

    return new Promise(
        (resolve,reject)=>{

            if(!file){

                reject(
                    new Error(
                        "ファイルが選択されていません。"
                    )
                );

                return;
            }

            const reader =
                new FileReader();


            reader.onload = () =>
                resolve(
                    reader.result
                );


            reader.onerror = () =>
                reject(
                    new Error(
                        "ファイル読み込みエラー: " +
                        file.name
                    )
                );


            reader.readAsArrayBuffer(
                file
            );
        }
    );
}


function createBlankDisk(
    size
){

    try{

        return new ArrayBuffer(
            size
        );

    }catch(error){

        throw new Error(
            "仮想HDDのメモリ確保に失敗しました。\n" +
            "RAMやディスクサイズを小さくしてください。\n\n" +
            error.message
        );
    }
}


/* ==========================================================
   v86 detection
========================================================== */

function getV86(){

    if(
        typeof window.V86 ===
        "function"
    ){

        return window.V86;

    }


    if(
        typeof window.V86Starter ===
        "function"
    ){

        return window.V86Starter;

    }


    return null;
}


/* ==========================================================
   Diagnostics
========================================================== */

async function checkURL(
    url
){

    try{

        const response =
            await fetch(
                url,
                {
                    method:"HEAD",
                    cache:"no-store"
                }
            );


        if(
            response.ok
        ){

            return true;

        }

    }catch(_){}


    return false;
}


async function diagnostics(){

    const d =
        $("diagnostics");


    const lines = [];


    /* -----------------------------------------------
       JavaScript
    ------------------------------------------------ */

    if(
        getV86()
    ){

        lines.push(
            '<span class="diagOk">[✓] libv86.js</span>'
        );

    }else{

        lines.push(
            '<span class="diagBad">[✗] libv86.js</span>'
        );

    }


    /* -----------------------------------------------
       WebAssembly
    ------------------------------------------------ */

    if(
        typeof WebAssembly !==
        "undefined"
    ){

        lines.push(
            '<span class="diagOk">[✓] WebAssembly</span>'
        );

    }else{

        lines.push(
            '<span class="diagBad">[✗] WebAssembly</span>'
        );

    }


    /* -----------------------------------------------
       Protocol
    ------------------------------------------------ */

    if(
        location.protocol ===
        "file:"
    ){

        lines.push(
            '<span class="diagWarn">[!] file://</span>'
        );

        lines.push(
            '<span class="diagWarn">' +
            '    HTTPサーバー経由での実行を推奨' +
            '</span>'
        );

    }else{

        lines.push(
            '<span class="diagOk">[✓] HTTP/HTTPS</span>'
        );

    }


    /* -----------------------------------------------
       Runtime files
    ------------------------------------------------ */

    const files = [
        [
            "v86.wasm",
            "./v86.wasm"
        ],
        [
            "seabios.bin",
            "./seabios.bin"
        ],
        [
            "vgabios.bin",
            "./vgabios.bin"
        ]
    ];


    for(
        const [name,url]
        of files
    ){

        /*
          file:// ではHEADが使えないことがあるため、
          JavaScriptの存在確認だけを行う。
        */

        if(
            location.protocol ===
            "file:"
        ){

            lines.push(
                '<span class="diagWarn">' +
                '[?] ' + name +
                ' — HTTP環境で確認してください' +
                '</span>'
            );

            continue;
        }


        const exists =
            await checkURL(
                url
            );


        if(exists){

            lines.push(
                '<span class="diagOk">' +
                '[✓] ' + name +
                '</span>'
            );

        }else{

            lines.push(
                '<span class="diagBad">' +
                '[✗] ' + name +
                '</span>'
            );

        }

    }


    d.innerHTML =
        lines.join("<br>");


    return (
        !!getV86() &&
        typeof WebAssembly !==
        "undefined"
    );
}


/* ==========================================================
   Automatic profile settings
========================================================== */

function getProfile(){

    const architecture =
        $("architecture").value;

    const profile =
        $("osProfile").value;


    /*
      x64 backendはまだv86では実装されていない。
    */

    if(
        architecture ===
        "x64"
    ){

        return {
            supported:false,
            reason:
                "現在のv86バックエンドはx86-64非対応です。"
        };

    }


    let memory =
        Number(
            $("ram").value
        );


    let acpi =
        false;


    let vgaMemory =
        8 * 1024 * 1024;


    if(
        profile ===
        "winxp"
    ){

        memory =
            Math.max(
                memory,
                128 * 1024 * 1024
            );

        /*
          v86ではACPIがexperimental。
          デフォルトはfalseにする。
        */

        acpi =
            false;

    }


    if(
        profile ===
        "win95"
    ){

        memory =
            Math.min(
                Math.max(
                    memory,
                    64 * 1024 * 1024
                ),
                512 * 1024 * 1024
            );

        acpi =
            false;

    }


    return {
        supported:true,
        memory,
        acpi,
        vgaMemory
    };
}


/* ==========================================================
   Fullscreen
========================================================== */

async function fullscreen(){

    const target =
        $("emulator");


    try{

        if(
            document.fullscreenElement
        ){

            return;

        }


        if(
            target.requestFullscreen
        ){

            await target.requestFullscreen();

        }

    }catch(error){

        console.warn(
            "Fullscreen failed:",
            error
        );

    }
}


/* ==========================================================
   Start
========================================================== */

async function start(){

    const Constructor =
        getV86();


    if(!Constructor){

        status(
            "❌ v86を読み込めません。\n\n" +
            "libv86.jsが見つからないか、" +
            "正しく実行されていません。",
            "error"
        );

        return;
    }


    const profile =
        getProfile();


    if(
        !profile.supported
    ){

        status(
            "⚠️ 64-bitモードはまだ使用できません。\n\n" +
            profile.reason +
            "\n\n" +
            "Windows 10/11の64-bit ISOを動かすには、" +
            "x86-64を実装した別バックエンドが必要です。",
            "warn"
        );

        return;
    }


    const isoFile =
        $("iso").files[0];


    if(!isoFile){

        status(
            "❌ ISOを選択してください。",
            "error"
        );

        return;
    }


    $("boot").disabled =
        true;


    $("emulator").style.display =
        "block";


    $("bootOverlay").style.display =
        "flex";


    /*
      ユーザー操作直後なので
      Fullscreen要求を行う。
    */

    fullscreen();


    try{

        /* ==========================================
           ISO
        ========================================== */

        bootMessage(
            "ISOを読み込んでいます..."
        );


        const iso =
            await fileBuffer(
                isoFile
            );


        /* ==========================================
           HDD
        ========================================== */

        let hdd;


        const hddFile =
            $("hdd").files[0];


        if(hddFile){

            bootMessage(
                "既存HDDイメージを読み込んでいます..."
            );


            hdd =
                await fileBuffer(
                    hddFile
                );

        }else{

            bootMessage(
                "仮想HDDを作成しています..."
            );


            hdd =
                createBlankDisk(
                    Number(
                        $("diskSize").value
                    )
                );

        }


        /* ==========================================
           Floppy
        ========================================== */

        let fda =
            null;


        const fdaFile =
            $("fda").files[0];


        if(fdaFile){

            bootMessage(
                "フロッピーを読み込んでいます..."
            );


            fda =
                await fileBuffer(
                    fdaFile
                );

        }


        /* ==========================================
           v86 options
        ========================================== */

        bootMessage(
            "v86を初期化しています..."
        );


        const options = {

            memory_size:
                profile.memory,


            vga_memory_size:
                profile.vgaMemory,


            screen_container:
                $("screen"),


            bios:{
                url:
                    "./seabios.bin"
            },


            vga_bios:{
                url:
                    "./vgabios.bin"
            },


            /*
              v86公式BootOrder:
              CD / Floppy / Hard Disk
            */

            boot_order:
                0x213,


            cdrom:{
                buffer:
                    iso
            },


            hda:{
                buffer:
                    hdd
            },


            acpi:
                profile.acpi,


            autostart:
                false
        };


        if(fda){

            options.fda = {
                buffer:
                    fda
            };

        }


        /* ==========================================
           Create emulator
        ========================================== */

        emulator =
            new Constructor(
                options
            );


        /*
          イベント監視
        */

        if(
            emulator.add_listener
        ){

            emulator.add_listener(
                "emulator-ready",
                ()=>{
                    console.log(
                        "superEmulator: ready"
                    );
                }
            );


            emulator.add_listener(
                "emulator-started",
                ()=>{
                    emulatorRunning =
                        true;

                    console.log(
                        "superEmulator: started"
                    );
                }
            );


            emulator.add_listener(
                "emulator-stopped",
                ()=>{
                    emulatorRunning =
                        false;

                    console.log(
                        "superEmulator: stopped"
                    );
                }
            );


            emulator.add_listener(
                "download-error",
                event=>{
                    console.error(
                        "v86 download-error:",
                        event
                    );
                }
            );

        }


        /* ==========================================
           Run
        ========================================== */

        bootMessage(
            "エミュレーターを起動しています..."
        );


        if(
            typeof emulator.run ===
            "function"
        ){

            emulator.run();

        }


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    1200
                )
        );


        $("bootOverlay").style.display =
            "none";


        $("runtimeInfo").textContent =
            "superEmulator • x86 • " +
            $("osProfile").value;


        status(
            "✓ superEmulatorを起動しました。\n" +
            "ISO: " +
            isoFile.name,
            "ok"
        );


    }catch(error){

        console.error(
            "superEmulator error:",
            error
        );


        $("bootOverlay").style.display =
            "none";


        let message =
            "❌ エミュレーターを起動できませんでした。\n\n";


        message +=
            error &&
            error.message
                ? error.message
                : String(error);


        message +=
            "\n\n診断:\n";


        if(
            location.protocol ===
            "file:"
        ){

            message +=
                "・file://で開いています\n" +
                "・HTTPサーバー経由で試してください\n";

        }


        message +=
            "・v86.wasm\n" +
            "・seabios.bin\n" +
            "・vgabios.bin\n" +
            "の配置を確認してください。";


        status(
            message,
            "error"
        );


        stop();


    }finally{

        $("boot").disabled =
            false;

    }
}


/* ==========================================================
   Stop
========================================================== */

function stop(){

    try{

        if(
            emulator &&
            typeof emulator.stop ===
            "function"
        ){

            emulator.stop();

        }

    }catch(error){

        console.warn(
            "stop error:",
            error
        );

    }


    emulator =
        null;


    emulatorRunning =
        false;


    $("emulator").style.display =
        "none";


    $("bootOverlay").style.display =
        "none";


    if(
        document.fullscreenElement
    ){

        document
            .exitFullscreen()
            .catch(
                ()=>{}
            );

    }

}


/* ==========================================================
   Reset
========================================================== */

function reset(){

    if(!emulator){

        return;

    }


    try{

        if(
            typeof emulator.restart ===
            "function"
        ){

            emulator.restart();

        }else if(
            typeof emulator.reset ===
            "function"
        ){

            emulator.reset();

        }

    }catch(error){

        status(
            "リセットに失敗しました:\n" +
            error.message,
            "error"
        );

    }

}


/* ==========================================================
   Pause
========================================================== */

function togglePause(){

    if(!emulator){

        return;

    }


    try{

        if(
            emulatorRunning
        ){

            if(
                emulator.stop
            ){

                emulator.stop();

            }

            emulatorRunning =
                false;

            $("pause").textContent =
                "▶ 再開";

        }else{

            if(
                emulator.run
            ){

                emulator.run();

            }

            emulatorRunning =
                true;

            $("pause").textContent =
                "⏸ 一時停止";

        }

    }catch(error){

        console.error(
            error
        );

    }

}


/* ==========================================================
   Events
========================================================== */

$("boot").addEventListener(
    "click",
    start
);


$("fullscreen").addEventListener(
    "click",
    fullscreen
);


$("reset").addEventListener(
    "click",
    reset
);


$("pause").addEventListener(
    "click",
    togglePause
);


$("exit").addEventListener(
    "click",
    stop
);


/* ==========================================================
   Architecture UI
========================================================== */

$("architecture").addEventListener(
    "change",
    ()=>{

        const value =
            $("architecture").value;


        if(
            value ===
            "x64"
        ){

            status(
                "⚠️ x86-64モードを選択しました。\n\n" +
                "現在のv86バックエンドは64-bit CPU命令を実装していないため、" +
                "Windows 10/11の64-bit ISOは起動できません。\n\n" +
                "このUIは将来のx64バックエンド追加用に用意されています。",
                "warn"
            );

        }else{

            status(
                "x86モード: v86を使用できます。",
                "ok"
            );

        }

    }
);


/* ==========================================================
   OS Profile UI
========================================================== */

$("osProfile").addEventListener(
    "change",
    ()=>{

        const profile =
            $("osProfile").value;


        if(
            profile ===
            "win10" ||
            profile ===
            "win11"
        ){

            $("architecture").value =
                "x64";


            status(
                "⚠️ Windows 10/11を選択しました。\n\n" +
                "このv86バックエンドではx86-64が未実装のため、" +
                "64-bit Windowsはまだ起動できません。",
                "warn"
            );

        }

    }
);


/* ==========================================================
   Startup
========================================================== */

window.addEventListener(
    "load",
    async ()=>{

        await diagnostics();


        if(
            getV86()
        ){

            status(
                "✓ v86を検出しました。\n" +
                "ISOを選択して起動できます。",
                "ok"
            );

        }else{

            status(
                "❌ libv86.jsを読み込めません。\n\n" +
                "index.htmlとlibv86.jsの場所を確認してください。",
                "error"
            );

        }

    }
);


/* ==========================================================
   Prevent accidental browser shortcuts while emulator active
========================================================== */

window.addEventListener(
    "keydown",
    event=>{

        if(
            $("emulator").style.display !==
            "block"
        ){

            return;

        }


        if(
            event.key ===
            "F11"
        ){

            event.preventDefault();

            fullscreen();

        }

    }
);
